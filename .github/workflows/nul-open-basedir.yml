name: NUL open_basedir compatibility

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: PHP ${{ matrix.php }} ${{ matrix.phpts }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.10', '8.5.11']
        phpts: [ts, nts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact official release
        shell: pwsh
        env:
          EXPECTED_PHP: ${{ matrix.php }}
          EXPECTED_PHPTS: ${{ matrix.phpts }}
        run: |
          $suffix = if ($env:EXPECTED_PHPTS -eq 'nts') { '-nts' } else { '' }
          $archive = if ($env:EXPECTED_PHP -eq '8.5.10') { 'archives/' } else { '' }
          $file = "php-$($env:EXPECTED_PHP)$suffix-Win32-vs17-x64.zip"
          Invoke-WebRequest "https://downloads.php.net/~windows/releases/$archive$file" -OutFile "$env:RUNNER_TEMP/php.zip"
          Get-FileHash "$env:RUNNER_TEMP/php.zip"
          Expand-Archive "$env:RUNNER_TEMP/php.zip" "$env:RUNNER_TEMP/php-exact"
          "$env:RUNNER_TEMP/php-exact" | Out-File $env:GITHUB_PATH -Append
      - name: Record and verify reported behavior
        shell: pwsh
        env:
          EXPECTED_PHP: ${{ matrix.php }}
          EXPECTED_PHPTS: ${{ matrix.phpts }}
        run: |
          $reports = foreach ($mode in 'unrestricted', 'root', 'root-nul', 'directory', 'directory-nul') {
            $json = & php -n ./check.php $mode
            if ($LASTEXITCODE -ne 0) { throw "PHP failed for ${mode}: $json" }
            $json | ConvertFrom-Json
          }
          $reports | ConvertTo-Json -Depth 8 | Tee-Object -FilePath results.json
          foreach ($report in $reports) {
            if ($report.php -ne $env:EXPECTED_PHP -or $report.zts -ne ($env:EXPECTED_PHPTS -eq 'ts') -or $report.bits -ne 64) {
              throw 'Unexpected PHP build'
            }
            if (!$report.allowed_file) { throw "Allowed file rejected: $($report.mode)" }
            $expected = $report.php -eq '8.5.10' -or $report.mode -in 'unrestricted', 'root-nul', 'directory-nul'
            foreach ($operation in $report.results.PSObject.Properties) {
              if ($operation.Value.success -ne $expected) {
                throw "Unexpected result: $($report.mode), $($operation.Name)"
              }
            }
            if ($expected -and $report.results.proc_open.exit_code -ne 0) { throw 'Child process failed' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nul-open-basedir-${{ matrix.php }}-${{ matrix.phpts }}
          path: results.json
          if-no-files-found: error
