name: Verify release tag regex and prerelease publishing
'on':
  push: null
  workflow_dispatch: null
permissions:
  contents: read
  packages: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        registry:
          - npm
          - github
        event:
          - release
          - workflow_dispatch
    defaults:
      run:
        working-directory: package
    env:
      verbose: vvv
      TEST_REGISTRY: ${{ matrix.registry }}
      TEST_EVENT: ${{ matrix.event }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/setup-php
          ref: 721738bc73ce93e7299e6da78273f37d27e12eae
          path: package
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build the package
        run: |
          npm ci
          npm run build
      - name: Change to GitHub Packages registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
          scope: '@shivammathur'
        if: matrix.registry == 'github'
      - name: Patch package.json
        run: |
          sed -i 's#"name": "#"name": "@shivammathur/#' package.json
        if: matrix.registry == 'github'
      - name: Verify event selection and dry-run all four release stages
        run: node ../scripts/verify.cjs
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'github' && github.token || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: publish-${{ matrix.registry }}-${{ matrix.event }}
          path: evidence
