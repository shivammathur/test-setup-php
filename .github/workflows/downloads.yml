name: Native download retry validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shivammathur/setup-php
          ref: ac61989611135387ba5e737e9fe00ca5d0692497
          path: setup-php
      - name: Verify download behavior with a local HTTP server
        run: python3 native-download-qa.py
        env:
          SETUP_PHP_TEST_ROOT: ${{ github.workspace }}/setup-php
  legacy:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install native test dependencies
        run: apt-get update && apt-get install -y curl python3 git ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shivammathur/setup-php
          ref: ac61989611135387ba5e737e9fe00ca5d0692497
          path: setup-php
      - name: Verify compatibility with legacy curl
        run: |
          curl --version
          python3 native-download-qa.py
        env:
          SETUP_PHP_TEST_ROOT: ${{ github.workspace }}/setup-php
  couchbase:
    runs-on: ubuntu-22.04
    steps:
      - uses: shivammathur/setup-php@ac61989611135387ba5e737e9fe00ca5d0692497
        with:
          php-version: '8.1'
          extensions: couchbase
      - name: Verify Couchbase binary
        run: |
          php --ri couchbase
          php -r "if (!extension_loaded('couchbase')) { exit(1); }"
          ldd "$(php-config --extension-dir)/couchbase.so"
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0']
    steps:
      - uses: shivammathur/setup-php@ac61989611135387ba5e737e9fe00ca5d0692497
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            csv-https://gitlab.com/Girgias/csv-php-extension@0.4.0,
            gd-php/php-src@PHP-${{ matrix.php }},
            mongodb-mongodb/mongo-php-driver@v1.9,
            protobuf-protocolbuffers/protobuf@v3.15.8,
            igbinary,
            msgpack,
            redis-5.3.5
        env:
          CSV_CONFIGURE_OPTS: --enable-csv
          GD_CONFIGURE_PREFIX_OPTS: CFLAGS=-std=gnu17
          GD_CONFIGURE_OPTS: --enable-gd=shared,/usr --with-external-gd --with-jpeg
          GD_LIBS: libgd-dev libjpeg-dev
          GD_PATH: ext/gd
          PROTOBUF_CONFIGURE_OPTS: --enable-protobuf
          PROTOBUF_PATH: php/ext/google/protobuf
          REDIS_CONFIGURE_OPTS: --enable-redis --enable-redis-igbinary --enable-redis-msgpack --enable-redis-lzf --with-liblzf --enable-redis-zstd --with-libzstd --enable-redis-lz4 --with-liblz4
          REDIS_LIBS: liblz4-dev, liblzf-dev, libzstd-dev

      - name: Test PHP version
        run: php -v

      - name: Test extensions
        run: |
          php -r "echo phpversion('redis');"
          php -m
          php -r "if(! extension_loaded('csv')) {throw new Exception('csv not found');}";
          php -r "if(! extension_loaded('gd')) {throw new Exception('gd not found');}";
          php -r "if(! extension_loaded('mongodb')) {throw new Exception('mongodb not found');}";
          php -r "if(! extension_loaded('protobuf')) {throw new Exception('protobuf not found');}";
          php -r "if(! extension_loaded('redis')) {throw new Exception('redis not found');}";
