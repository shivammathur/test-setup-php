name: Investigate PHP child startup without PNG dependencies
on:
  push:
    branches: [test/libpng-1.6.59-20261002]
    paths: [isolation-matrix.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: echo "value=$(jq -c . isolation-matrix.json)" >> "$GITHUB_OUTPUT"
  diagnose:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: php/php-src
          ref: ${{ matrix.source_sha }}
          path: php-src
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-windows-builder
          ref: 44b177dd05168995a788123c8807a70e2d0db20c
          path: builder
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Repeat failing tests with only their required extension
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/dependency-isolation.ps1 -Label '${{ matrix.label }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolation-${{ matrix.label }}
          path: reports
          if-no-files-found: error
