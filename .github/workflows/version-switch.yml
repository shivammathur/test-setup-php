name: Review normal Windows extension version changes
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  switch:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        errors: ['Off', 'On']
    env:
      verbose: vvv
      fail-fast: 'true'
      PHPTS: nts
      OUTAGE: 'false'
      ACTION_NAME: develop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@75fa893d48ed4c16769683123e5881d4d7d817ad
        with:
          php-version: '8.4'
          extensions: redis-6.1.0
          tools: none
          ini-values: display_errors=${{ matrix.errors }}, display_startup_errors=${{ matrix.errors }}
      - name: Verify initial extension and cache miss for 6.2.0
        shell: pwsh
        run: |
          ./scripts/snapshot.ps1 before
          if (Test-Path C:/tools/php/ext/redis-6.2.0) {throw 'Unexpected pre-existing Redis 6.2.0 cache'}
      - name: Upgrade Redis without changing PHP
        id: requested
        continue-on-error: true
        uses: shivammathur/setup-php@75fa893d48ed4c16769683123e5881d4d7d817ad
        with:
          php-version: '8.4'
          extensions: redis-6.2.0
          tools: none
      - name: Verify Redis 6.2.0 loads
        if: always()
        shell: pwsh
        run: ./scripts/snapshot.ps1 after
        env:
          SETUP_OUTCOME: ${{ steps.requested.outcome }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: version-switch-${{ matrix.errors }}
          path: evidence
