name: Validate proc_open Windows quoting
on: push
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, php: '8.4'}
          - {os: windows-latest, php: '8.5'}
          - {os: windows-latest, php: '8.6'}
          - {os: ubuntu-latest, php: '8.4'}
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: 95a3eb77c7458af3caad459f2ba16b138c189737
          fetch-depth: 2
          path: php-src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /run-tests.php
            /ext/standard/tests/general_functions/proc_open_null.phpt
            /ext/standard/tests/general_functions/proc_open_redirect.phpt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: opcache
        env:
          phpts: ts
      - name: Restore original tests and save the exact patch
        shell: bash
        working-directory: php-src
        run: |
          test "$(git rev-parse HEAD^)" = 455a419b09740d2f87080677af274ef530aeeebb
          git diff HEAD^ HEAD -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt > ../fix.patch
          git checkout HEAD^ -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt
      - name: Verify original failures on Windows
        shell: pwsh
        working-directory: php-src
        run: ../harness/verify-proc-open.ps1 -Phase before
      - name: Apply our patch
        shell: bash
        working-directory: php-src
        run: |
          git apply --check ../fix.patch
          git apply ../fix.patch
          git diff --exit-code HEAD -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt
      - name: Verify both tests pass with our patch
        shell: pwsh
        working-directory: php-src
        run: ../harness/verify-proc-open.ps1 -Phase after
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proc-open-${{ matrix.os }}-${{ matrix.php }}
          path: |
            fix.patch
            php-src/results/
