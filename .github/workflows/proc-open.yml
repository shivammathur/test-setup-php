name: Validate proc_open Windows quoting
run-name: Compare GH-24335 and GH-24343 with compiled Windows PHP
on: push
permissions:
  contents: read
jobs:
  test:
    name: Windows PHP 8.4 ZTS - ${{ matrix.core }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        core: [baseline, pr24335]
    env:
      PHP_TEST_BINARY: C:\php-proc-open-build\Release_TS\php.exe
      PHP_TEST_OPCACHE: C:\php-proc-open-build\Release_TS\php_opcache.dll
    steps:
      - name: Preserve LF source files
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: 95a3eb77c7458af3caad459f2ba16b138c189737
          fetch-depth: 2
          path: php-src
      - uses: actions/checkout@v6
        with:
          repository: php/php-sdk-binary-tools
          ref: php-sdk-2.8.4
          path: sdk
      - name: Prepare the original tests and exact patches
        shell: bash
        working-directory: php-src
        run: |
          test "$(git rev-parse HEAD^)" = 455a419b09740d2f87080677af274ef530aeeebb
          git diff HEAD^ HEAD -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt > ../fix.patch
          git checkout HEAD^ -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt
          if [ '${{ matrix.core }}' = pr24335 ]; then
            git apply --check ../harness/pr24335.patch
            git apply ../harness/pr24335.patch
          fi
          git diff HEAD^ -- ext/standard/proc_open.c > ../core.patch
      - name: Build PHP CLI and OPcache from source
        shell: cmd
        working-directory: php-src
        run: |
          for /f "delims=" %%T in ('call .github\scripts\windows\find-vs-toolset.bat vs17') do set "VS_TOOLSET=%%T"
          call ..\sdk\phpsdk-vs17-x64.bat -s %VS_TOOLSET% -t %GITHUB_WORKSPACE%\harness\build-minimal.bat
          if errorlevel 1 exit /b 1
          if not exist "%PHP_TEST_BINARY%" exit /b 1
          if not exist "%PHP_TEST_OPCACHE%" exit /b 1
      - name: Record compiled binary provenance
        shell: pwsh
        working-directory: php-src
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          & $env:PHP_TEST_BINARY -n -v | Tee-Object results/version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHP_TEST_BINARY -n -r 'if (!PHP_ZTS) { exit(1); } echo PHP_BINARY, PHP_EOL;'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash $env:PHP_TEST_BINARY, (Join-Path (Split-Path $env:PHP_TEST_BINARY) 'php8ts.dll'), $env:PHP_TEST_OPCACHE | Format-Table -AutoSize | Out-String | Set-Content results/binary-hashes.txt
          New-Item -ItemType Directory -Force results/binaries | Out-Null
          Copy-Item $env:PHP_TEST_BINARY, (Join-Path (Split-Path $env:PHP_TEST_BINARY) 'php8ts.dll'), $env:PHP_TEST_OPCACHE results/binaries/
          git diff HEAD^ -- ext/standard/proc_open.c | Set-Content results/core.patch
      - name: Require both current tests to reproduce the quoting failures
        shell: pwsh
        working-directory: php-src
        run: ../harness/verify-proc-open.ps1 -Phase current -ExpectFailure
      - name: Apply only our quoting patch to the tests
        shell: bash
        working-directory: php-src
        run: |
          git apply --check ../fix.patch
          git apply ../fix.patch
          git diff --exit-code HEAD -- ext/standard/tests/general_functions/proc_open_null.phpt ext/standard/tests/general_functions/proc_open_redirect.phpt
      - name: Require both tests to pass with our quoting patch
        shell: pwsh
        working-directory: php-src
        run: ../harness/verify-proc-open.ps1 -Phase quoting
      - name: Restore the test files from GH-24335's green CI checkout
        shell: pwsh
        working-directory: php-src
        run: Copy-Item ../harness/historical/*.phpt ext/standard/tests/general_functions/
      - name: Require the historical temporary-file tests to pass
        shell: pwsh
        working-directory: php-src
        run: ../harness/verify-proc-open.ps1 -Phase historical
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proc-open-compiled-${{ matrix.core }}
          path: |
            fix.patch
            core.patch
            harness/pr24335.patch
            harness/historical/
            php-src/results/
            php-src/build.log
