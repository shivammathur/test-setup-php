name: Compare JPEG NO_GETENV
on:
  push:
    branches: [test/libjpeg-nogetenv-20261030]
    paths: ['.github/workflows/jpeg-compare.yml', 'scripts/**', 'tests/**', 'native-plan.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: echo "matrix=$(jq -c '{include:.}' native-plan.json)" >> "$GITHUB_OUTPUT"
  compare:
    needs: plan
    name: ${{ matrix.vs }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: winlibs/winlib-builder
          ref: 0a3eb556ea0a723e38ad93628c119195d170f25b
          path: builder
      - uses: actions/checkout@v6
        with:
          repository: winlibs/libjpeg
          ref: 5e31759d415fef210f96b75bab79fe22aa77680a
          path: no_getenv-src
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/libjpeg
          ref: 4324213718242f94b2df8ee099ef71283c076610
          path: patched-src
      - name: Compute compiler inputs
        id: virtuals
        shell: powershell
        run: ./builder/scripts/compute-virtuals.ps1 -version '${{ matrix.php }}' -arch '${{ matrix.arch }}' -sdk '${{ matrix.sdk }}'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.sdk }}
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch != 'arm64'
      - name: Build both candidates and run upstream tests
        shell: pwsh
        run: ./scripts/build.ps1 -VsInst '${{ steps.virtuals.outputs.vsinst }}' -MsArch '${{ steps.virtuals.outputs.msarch }}' -MsTs '${{ steps.virtuals.outputs.msts }}' -Sdk '${{ matrix.sdk }}'
      - name: Check behavior and compare all three variants
        shell: pwsh
        run: ./scripts/compare.ps1 -Vs '${{ matrix.vs }}' -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpeg-no-getenv-${{ matrix.vs }}-${{ matrix.arch }}
          path: reports
          if-no-files-found: error
