name: Published Windows PHP setup-php checks
run-name: Windows release smoke ${{ inputs.ticket }}
on:
  push:
    branches: [feature/windows-release-smoke-20261021]
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m compileall -q scripts
  smoke:
    if: github.event_name == 'workflow_dispatch'
    name: PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        ts: [nts, ts]
    env:
      PHP_SERIES: ${{ matrix.php }}
      PHPTS: ${{ matrix.ts }}
      update: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify published metadata and prepare a fresh installation
        run: python scripts/check.py before
      - name: Install published PHP through setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Verify default startup, modules and installed payload hashes
        run: python scripts/check.py default
      - name: Enable bundled modules for functional checks
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, zip
          tools: none
        env:
          update: 'false'
      - name: Test runtime functions and CGI
        run: python scripts/check.py extended
      - name: Save verified result
        run: python scripts/check.py finish
      - name: Retain logs and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.php }}-${{ matrix.ts }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 90
