name: PHP release freshness Ubuntu follow-up
on: push
permissions:
  contents: read
jobs:
  ubuntu-php56:
    name: Ubuntu PHP 5.6
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    uses: ./.github/workflows/check-php-release.yml
    with:
      runner: ${{ matrix.runner }}
      php: '5.6'

  ubuntu-slim:
    name: Ubuntu Slim with hosted cache
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    uses: ./.github/workflows/check-php-release.yml
    with:
      runner: ubuntu-slim
      php: ${{ matrix.php }}
      hosted-cache-diagnostic: true
