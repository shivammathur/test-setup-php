name: Validate SNMP and ICU security backports
run-name: SNMP and ICU security artifact QA
on:
  push:
    branches: [test/snmp-icu-security-20260912]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Native backport QA (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: winlibs/winlib-builder
          ref: 01708e0bea5cd008949e3349edba322e0a762838
          path: winlib-builder
      - name: Download Net-SNMP build
        uses: actions/download-artifact@v8
        with:
          repository: winlibs/winlib-builder
          run-id: 34670349667
          name: net-snmp-5.7.3-4-vs16-${{ matrix.arch }}
          github-token: ${{ github.token }}
          path: net-snmp
      - name: Download ICU build
        uses: actions/download-artifact@v8
        with:
          repository: winlibs/winlib-builder
          run-id: 34670349607
          name: ICU-71.1-2-vs16-${{ matrix.arch }}
          github-token: ${{ github.token }}
          path: icu
      - name: Verify artifact source and vulnerability metadata
        shell: pwsh
        run: |
          New-Item reports -ItemType Directory -Force | Out-Null
          ./tests/verify-backport-metadata.ps1 -Arch '${{ matrix.arch }}' *>&1 | Tee-Object reports/artifact-metadata.log
      - name: Set up VS16 compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          toolset: '14.29'
      - name: Fetch matching OpenSSL dependency
        shell: pwsh
        run: ./winlib-builder/scripts/fetch-deps.ps1 -lib net-snmp -version 8.2 -vs vs16 -arch '${{ matrix.arch }}' -stability staging
      - name: Verify Net-SNMP cache fix
        shell: pwsh
        run: |
          New-Item reports -ItemType Directory -Force | Out-Null
          ./tests/net-snmp/test-mib-index.ps1 -InstallRoot net-snmp -DependencyRoot deps *>&1 | Tee-Object reports/snmp-regression.log
      - name: Verify ICU collation fix
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/icu-collation.ps1 -InstallRoot icu *>&1 | Tee-Object reports/icu-regression.log
      - name: Verify SBOM and VEX generation
        if: ${{ !cancelled() && matrix.arch == 'x64' }}
        shell: pwsh
        run: ./tests/test-fixed-vulnerabilities.ps1 -BuilderRoot winlib-builder *>&1 | Tee-Object reports/sbom-regression.log
      - name: Save library artifact checksums
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Get-ChildItem net-snmp,icu -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content reports/library-sha256.json
      - name: Upload native QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: reports
          if-no-files-found: error
  php:
    name: PHP ${{ matrix.php }} backport QA
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            run: '34670584656'
          - php: '8.3'
            run: '34670460576'
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Wait for exact PHP build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item reports -ItemType Directory -Force | Out-Null
          $repo = 'shivammathur/php-windows-builder'
          $id = '${{ matrix.run }}'
          $deadline = (Get-Date).AddMinutes(65)
          while ((Get-Date) -lt $deadline) {
            $run = gh api "repos/$repo/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect source run' }
            if ($run.head_branch -ne 'master' -or $run.workflow_id -ne 251563593) { throw 'Unexpected source workflow/ref' }
            $artifacts = gh api "repos/$repo/actions/runs/$id/artifacts" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect source artifacts' }
            $ready = @($artifacts.artifacts | Where-Object { $_.name -eq 'artifacts' -and -not $_.expired })
            if ($ready.Count -eq 1) {
              $run | ConvertTo-Json -Depth 30 | Set-Content reports/source-run.json
              $ready[0] | ConvertTo-Json -Depth 20 | Set-Content reports/source-artifact.json
              break
            }
            if ($run.status -eq 'completed') { throw "Source run completed without artifacts: $($run.conclusion)" }
            Start-Sleep -Seconds 30
          }
          if ($ready.Count -ne 1) { throw 'Timed out waiting for source artifacts' }
      - name: Download exact PHP build artifacts
        uses: actions/download-artifact@v8
        with:
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: artifacts
          path: artifacts
      - name: Verify SNMP cache fix and Intl runtime
        shell: pwsh
        run: ./tests/security-backports.ps1 -ArtifactsDirectory artifacts -ReportsDirectory reports/backports
      - name: Upload PHP QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}-${{ matrix.run }}
          path: reports
          if-no-files-found: error
