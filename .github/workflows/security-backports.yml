name: Validate SNMP and ICU security backports
run-name: Published staging SNMP and ICU artifact QA
on:
  push:
    branches: [test/snmp-icu-security-20260912]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  php:
    name: PHP ${{ matrix.php }} backport QA
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            run: '34681407128'
          - php: '8.3'
            run: '34681408357'
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Wait for exact PHP build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item reports -ItemType Directory -Force | Out-Null
          $repo = 'shivammathur/php-windows-builder'
          $id = '${{ matrix.run }}'
          $deadline = (Get-Date).AddMinutes(65)
          while ((Get-Date) -lt $deadline) {
            $run = gh api "repos/$repo/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect source run' }
            if ($run.head_branch -ne 'master' -or $run.workflow_id -ne 251563593) { throw 'Unexpected source workflow/ref' }
            $artifacts = gh api "repos/$repo/actions/runs/$id/artifacts" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect source artifacts' }
            $ready = @($artifacts.artifacts | Where-Object { $_.name -eq 'artifacts' -and -not $_.expired })
            if ($ready.Count -eq 1) {
              $run | ConvertTo-Json -Depth 30 | Set-Content reports/source-run.json
              $ready[0] | ConvertTo-Json -Depth 20 | Set-Content reports/source-artifact.json
              break
            }
            if ($run.status -eq 'completed') { throw "Source run completed without artifacts: $($run.conclusion)" }
            Start-Sleep -Seconds 30
          }
          if ($ready.Count -ne 1) { throw 'Timed out waiting for source artifacts' }
      - name: Download exact PHP build artifacts
        uses: actions/download-artifact@v8
        with:
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: artifacts
          path: artifacts
      - name: Verify SNMP cache fix and Intl runtime
        shell: pwsh
        run: ./tests/security-backports.ps1 -ArtifactsDirectory artifacts -ReportsDirectory reports/backports
      - name: Upload PHP QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}-${{ matrix.run }}
          path: reports
          if-no-files-found: error
