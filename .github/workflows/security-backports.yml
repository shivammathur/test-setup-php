name: PHP security backport artifact tests
on:
  push:
    branches: [test/net-snmp-agent-cves-20260912]
permissions:
  contents: read
  actions: read
jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            run: '34697680571'
            backports: true
            expected: '{"net-snmp":"net-snmp-5.7.3-5-","ICU":"icu-71.1-2-","glib":"glib-2.88.3-","libcurl":"libcurl-8.22.0-","liblzma":"liblzma-5.8.4-","openssl":"openssl-3.0.22.pl1-"}'
          - php: '8.3'
            run: '34699206356'
            backports: true
            expected: '{"net-snmp":"net-snmp-5.7.3-5-","glib":"glib-2.88.3-","libcurl":"libcurl-8.22.0-","liblzma":"liblzma-5.8.4-","openssl":"openssl-3.0.22.pl1-"}'
          - php: '8.4'
            run: '34694921641'
            expected: '{"glib":"glib-2.88.3-","libcurl":"libcurl-8.22.0-","liblzma":"liblzma-5.8.4-","openssl":"openssl-3.0.22.pl1-"}'
          - php: '8.5'
            run: '34694925030'
            expected: '{"glib":"glib-2.88.3-","libcurl":"libcurl-8.22.0-1-","liblzma":"liblzma-5.8.4-","openssl":"openssl-3.5.8-"}'
          - php: 'master'
            run: '34694931810'
            expected: '{"glib":"glib-2.88.3-","libcurl":"libcurl-8.22.0-1-","libheif":"libheif-1.23.4-","liblzma":"liblzma-5.8.4-","openssl":"openssl-4.0.2-"}'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: artifacts
          path: artifacts
      - name: Validate staged dependency identities and runtime DLL closure
        shell: pwsh
        run: ./tests/staged-dependency-artifacts.ps1 -ArtifactsDirectory artifacts -ReportsDirectory reports -ExpectedPackages '${{ matrix.expected }}'
      - name: Validate merged Net-SNMP and ICU security metadata
        if: matrix.backports == true
        shell: pwsh
        run: ./tests/security-backports.ps1 -ArtifactsDirectory artifacts -ReportsDirectory reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-backports-${{ matrix.php }}
          path: reports
          if-no-files-found: warn
