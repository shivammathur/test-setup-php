name: Test repaired PHP cache aliases

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aliases:
    name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.ts }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-15-intel, macos-26-intel]
        build: [release, debug]
        ts: [nts, zts]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_DEVELOPER: '1'
      EXPECTED_TS: ${{ matrix.ts }}
      EXPECTED_BUILD: ${{ matrix.build }}
      TEST_JOB: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.ts }}
      phpts: ${{ matrix.ts }}
      debug: ${{ matrix.build == 'debug' && 'true' || 'false' }}
      verbose: 'true'
      fail-fast: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the staged repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(jq -er .stage_run cache-repair.json)
          gh run download "$run" --repo shivammathur/php-darwin --name repaired-php-8.5 --dir repaired
          cmp cache-repair.json repaired/stage.json
          bash prepare.sh
      - name: Start archive server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory repaired > "$RUNNER_TEMP/archive-server.log" 2>&1 &
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/stage.json >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install PHP and Swoole using the released action
        id: setup
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: swoole
          tools: none
          coverage: none
        env:
          BASH_ENV: ${{ github.workspace }}/installer-hook.sh
          PHP_DARWIN_TEST_INSTALLER: ${{ github.workspace }}/repaired/install.sh
          PHP_DARWIN_MIRROR_URL: ''
      - name: Verify Homebrew alias layout and exercise Swoole
        run: bash verify.sh
      - name: Collect installation and compilation diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp "$RUNNER_TEMP/php-darwin-setup-install.log" diagnostics/ 2>/dev/null || true
          cp "$RUNNER_TEMP/archive-server.log" diagnostics/ 2>/dev/null || true
          cp -R "$HOME/Library/Logs/Homebrew" diagnostics/homebrew 2>/dev/null || true
          php -v > diagnostics/php-version.txt 2>&1 || true
          php --ri swoole > diagnostics/swoole-info.txt 2>&1 || true
          cp cache-repair.json diagnostics/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alias-evidence-${{ env.TEST_JOB }}
          path: diagnostics
          retention-days: 14
          if-no-files-found: error
