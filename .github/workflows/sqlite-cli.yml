name: Validate SQLite 3.54.1-1 VEX rebuild
on:
  push:
    branches: [test/sqlite3-3.54.1-1-vex-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: SQLite CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: x86
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test exact rebuilt executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./audit.ps1 -Arch '${{ matrix.arch }}'
      - name: Save executable checks and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlite-cli-audit-${{ matrix.arch }}
          path: results/
          if-no-files-found: error
