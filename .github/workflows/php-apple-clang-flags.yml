name: PHP Apple Clang optimization comparison

on:
  push:
    branches:
      - test/php-apple-clang-flags-20260808
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTOREMOVE: "1"
  TAP_COMMIT: 7b1f746f137c67cc17008ee6abfae565a4549e28
  CORE_COMMIT: 609f595e51270120cc3c5306e9d431577bf497f1

jobs:
  compare:
    name: ${{ matrix.label }} / macOS 26
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: tap-php-86
            label: Tap PHP 8.6
            source: tap
            formula: shivammathur/php/php@8.6
            formula_file: Formula/php@8.6.rb
            php_series: "8.6"
          - id: tap-php-85-pgo
            label: Tap PHP 8.5 PGO
            source: tap
            formula: shivammathur/php/php
            formula_file: Formula/php.rb
            php_series: "8.5"
          - id: core-php-85
            label: Homebrew-core PHP 8.5
            source: core
            formula: homebrew/core/php
            formula_file: Formula/p/php.rb
            php_series: "8.5"
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out the test
        uses: actions/checkout@v7

      - name: Prepare result directories
        run: mkdir -p results "$RUNNER_TEMP/php-apple-clang-comparison"

      - name: Build, bottle, validate, and benchmark both variants
        env:
          TEST_ID: ${{ matrix.id }}
          TEST_LABEL: ${{ matrix.label }} / macOS 26
          FORMULA_SOURCE: ${{ matrix.source }}
          FORMULA_NAME: ${{ matrix.formula }}
          FORMULA_FILE: ${{ matrix.formula_file }}
          PHP_SERIES: ${{ matrix.php_series }}
        run: bash scripts/run-comparison.sh

      - name: Publish comparison summary
        if: always() && hashFiles('results/summary.md') != ''
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bottles and raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-apple-clang-${{ matrix.id }}-macos-26
          path: results
          if-no-files-found: error
          retention-days: 7
