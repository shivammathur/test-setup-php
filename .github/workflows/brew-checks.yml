name: Verify published ZTS formula test shutdown
on:
  workflow_dispatch:
    inputs:
      macos:
        description: Selected macOS formula and runner cases
        type: string
        default: '{"include":[]}'
      linux:
        description: Selected Linux formula and runner cases
        type: string
        default: '{"include":[]}'
permissions:
  contents: read
env:
  EXPECTED_TAP_COMMIT: bf1d6bec9dfc19f10e37d1b88ef6508e257e1fc4
jobs:
  check_macos:
    if: github.event_name == 'push' || inputs.macos != '{"include":[]}'
    name: ${{ matrix.formula }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.macos) || fromJSON('{"runner":["macos-15","macos-26","xcode-27"],"formula":["php@5.6","php@5.6-debug","php@5.6-zts","php@5.6-debug-zts","php@7.0","php@7.0-debug","php@7.0-zts","php@7.0-debug-zts","php@7.1","php@7.1-debug","php@7.1-zts","php@7.1-debug-zts","php@7.2","php@7.2-debug","php@7.2-zts","php@7.2-debug-zts","php@7.3","php@7.3-debug","php@7.3-zts","php@7.3-debug-zts","php@7.4","php@7.4-debug","php@7.4-zts","php@7.4-debug-zts","php@8.0","php@8.0-debug","php@8.0-zts","php@8.0-debug-zts","php@8.1","php@8.1-debug","php@8.1-zts","php@8.1-debug-zts","php@8.2","php@8.2-debug","php@8.2-zts","php@8.2-debug-zts","php@8.3","php@8.3-debug","php@8.3-zts","php@8.3-debug-zts","php@8.4","php@8.4-debug","php@8.4-zts","php@8.4-debug-zts","php","php-debug","php-zts","php-debug-zts"]}') }}
    defaults:
      run:
        shell: bash
    env:
      FORMULA: ${{ matrix.formula }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          core: true
          cask: false
          stable: false
      - name: Add tap and install formula
        run: |
          set -euo pipefail
          brew tap shivammathur/php
          brew trust shivammathur/php
          git -C "$(brew --repository shivammathur/php)" rev-parse HEAD
          git -C "$(brew --repository shivammathur/php)" merge-base --is-ancestor "$EXPECTED_TAP_COMMIT" HEAD
          brew install "shivammathur/php/$FORMULA"
      - name: Link installed formula
        run: |
          set -euo pipefail
          while IFS= read -r installed; do
            case "$installed" in
              php|php@*|php-debug|php-zts|php-debug-zts)
                if [ "$installed" != "$FORMULA" ]; then
                  brew unlink "$installed"
                fi
                ;;
            esac
          done < <(brew list --formula -1)
          brew link --overwrite --force "$FORMULA"
      - name: Check linked PHP and FPM
        run: |
          set -euo pipefail
          command -v php
          php --version
          php --ini
          php --modules
          php-cgi --version
          php-fpm --test
      - name: Run Homebrew formula test
        timeout-minutes: 15
        run: |
          set -euo pipefail
          brew install httpd
          brew test "shivammathur/php/$FORMULA"
  check_linux:
    if: github.event_name == 'push' || inputs.linux != '{"include":[]}'
    name: ${{ matrix.formula }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.linux) || fromJSON('{"runner":["ubuntu-24.04","ubuntu-24.04-arm"],"formula":["php@5.6","php@5.6-debug","php@5.6-zts","php@5.6-debug-zts","php@7.0","php@7.0-debug","php@7.0-zts","php@7.0-debug-zts","php@7.1","php@7.1-debug","php@7.1-zts","php@7.1-debug-zts","php@7.2","php@7.2-debug","php@7.2-zts","php@7.2-debug-zts","php@7.3","php@7.3-debug","php@7.3-zts","php@7.3-debug-zts","php@7.4","php@7.4-debug","php@7.4-zts","php@7.4-debug-zts","php@8.0","php@8.0-debug","php@8.0-zts","php@8.0-debug-zts","php@8.1","php@8.1-debug","php@8.1-zts","php@8.1-debug-zts","php@8.2","php@8.2-debug","php@8.2-zts","php@8.2-debug-zts","php@8.3","php@8.3-debug","php@8.3-zts","php@8.3-debug-zts","php@8.4","php@8.4-debug","php@8.4-zts","php@8.4-debug-zts","php","php-debug","php-zts","php-debug-zts"]}') }}
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images] Use the supported Homebrew container.
      options: --user=linuxbrew
    defaults:
      run:
        shell: bash
    env:
      FORMULA: ${{ matrix.formula }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          core: true
          cask: false
          stable: false
      - name: Add tap and install formula
        run: |
          set -euo pipefail
          brew tap shivammathur/php
          brew trust shivammathur/php
          git -C "$(brew --repository shivammathur/php)" rev-parse HEAD
          git -C "$(brew --repository shivammathur/php)" merge-base --is-ancestor "$EXPECTED_TAP_COMMIT" HEAD
          brew install "shivammathur/php/$FORMULA"
      - name: Link installed formula
        run: |
          set -euo pipefail
          while IFS= read -r installed; do
            case "$installed" in
              php|php@*|php-debug|php-zts|php-debug-zts)
                if [ "$installed" != "$FORMULA" ]; then
                  brew unlink "$installed"
                fi
                ;;
            esac
          done < <(brew list --formula -1)
          brew link --overwrite --force "$FORMULA"
      - name: Check linked PHP and FPM
        run: |
          set -euo pipefail
          command -v php
          php --version
          php --ini
          php --modules
          php-cgi --version
          php-fpm --test
      - name: Run Homebrew formula test
        timeout-minutes: 15
        run: |
          set -euo pipefail
          brew install httpd
          brew test "shivammathur/php/$FORMULA"
