name: Canonical staging series probe
run-name: Canonical staging series probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch standard series URLs using the builder request method
        shell: pwsh
        run: ./scripts/canonical-series-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-series-${{ matrix.runner }}
          path: reports/canonical-series
          if-no-files-found: error
