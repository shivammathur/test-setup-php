name: Verify canonical libzip publication
on:
  push:
    branches: [test/libzip-publication-20261009]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify canonical ZIP hashes and series selections
        run: python verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-publication
          path: results/
          if-no-files-found: error
