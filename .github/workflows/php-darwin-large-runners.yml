name: php-darwin on larger runners

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  cache:
    name: PHP 8.0 (macos-15-large)
    runs-on: macos-15-large
    timeout-minutes: 15
    steps:
      - name: Fetch php-darwin installer
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors -fsSL \
            https://github.com/shivammathur/php-darwin/releases/download/php-8.0/install.sh \
            -o "$RUNNER_TEMP/php-darwin-install.sh"

      - name: Install PHP from php-darwin with trace
        shell: bash
        run: bash -ex "$RUNNER_TEMP/php-darwin-install.sh" 8.0 release nts

      - name: Validate PHP and Homebrew
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          php -r 'exit(version_compare(PHP_VERSION, "8.0", ">=") && version_compare(PHP_VERSION, "8.1", "<") ? 0 : 1);'
          brew config >/dev/null
          brew info --json=v2 shivammathur/php/php@8.0 >/dev/null
          brew list --versions shivammathur/php/php@8.0
          brew linkage --test shivammathur/php/php@8.0
          php --version
