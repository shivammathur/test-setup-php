name: PHP.net source Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: PHP ${{ matrix.version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['8.2', '8.2.35-1', '8.3', '8.3.36-1', '8.4', '8.4.27-1', '8.5', '8.5.12-1']
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the upstream installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence | Out-Null
          $commit = 'f1cc5dae980d8c03bb5ca58335af08797e7f4c6e'
          $url = "https://raw.githubusercontent.com/php/web-php/$commit/public/include/download-instructions/windows.ps1"
          Invoke-WebRequest $url -UseBasicParsing -OutFile evidence/windows.ps1
          $hash = (Get-FileHash evidence/windows.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'c3559c15a2830170b3ca08fc768041b058d8a25e6beb0a61acb58c47b31151e5') {
            throw "Unexpected upstream installer hash: $hash"
          }
          @{ repository = 'php/web-php'; commit = $commit; url = $url; sha256 = $hash } |
            ConvertTo-Json | Set-Content evidence/installer-source.json
          Invoke-WebRequest 'https://downloads.php.net/~windows/releases/releases.json' -UseBasicParsing -OutFile evidence/releases.json
          @('', '', '', '1') | Set-Content installer-answers.txt -Encoding Ascii
      - name: Run the downloaded upstream installer
        shell: cmd
        run: |
          powershell -c "& ([ScriptBlock]::Create([IO.File]::ReadAllText('evidence\windows.ps1'))) -Version ${{ matrix.version }}" < installer-answers.txt > evidence\installer.log 2>&1
          set "installer_exit=%ERRORLEVEL%"
          type evidence\installer.log
          exit /b %installer_exit%
      - name: Verify installed rebuild and runtime
        shell: powershell
        run: ./verify.ps1 -Version '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.version }}
          path: evidence
          if-no-files-found: error
