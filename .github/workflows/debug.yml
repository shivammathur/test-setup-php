name: Debug setup-php PHP 8.0 fallback

on:
  push:
    branches:
      - test/php-darwin-8.0-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - name: Checkout setup-php develop
        uses: actions/checkout@v4
        with:
          repository: shivammathur/setup-php
          ref: develop
          path: setup-php
          persist-credentials: false

      - name: Run setup-php PHP installation with cache output
        run: |
          set -ex
          sed -i '' '/"php-darwin"/s# >/dev/null 2>&1##' setup-php/src/scripts/darwin.sh
          bash -x setup-php/src/scripts/darwin.sh 8.0 production

      - name: Confirm the php-darwin cache was used
        run: test -f /opt/homebrew/var/php-darwin/php_8.0-nts-release+darwin_arm64.json

      - name: Validate Homebrew after install
        run: |
          brew update
          brew upgrade
