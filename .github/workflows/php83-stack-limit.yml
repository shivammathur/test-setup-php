name: PHP 8.3 Windows x86 PCRE isolation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: revert-callback-argument-check
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: revert-callback-result-handling
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: revert-callback-result-null-check
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: revert-callback-result-allocation
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: revert-pcre-emalloc
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: revert-populate-subpat-checks
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
          - variant: noinline-callback-helper
            ref: f35ed4fb5cf44ef9ecc48e105b6a53b590d54f0b
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.8.4
      PHP_BUILD_CRT: vs16
      PLATFORM: x86
      THREAD_SAFE: '0'
      INTRINSICS: ''
      OPCACHE: '0'
      ASAN: '0'
      CLANG_TOOLSET: '0'
      VARIANT: ${{ matrix.variant }}
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
    steps:
      - name: Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ matrix.ref }}
          path: php-src
      - name: Prepare isolated change
        run: python ci/prepare.py
      - name: Build snapshot with upstream configuration
        working-directory: php-src
        shell: cmd
        run: .github\scripts\windows\build.bat > ..\evidence\build.log 2>&1
      - name: Run unmodified regression test and collect binaries
        run: python ci/verify.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php83-x86-${{ matrix.variant }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
  profile:
    name: Profile existing before/after binaries
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41001222080
          path: known-builds
      - name: Profile recursion with original binaries
        run: python ci/profile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php83-recursion-profile
          path: profile-evidence
          if-no-files-found: error
          retention-days: 14
