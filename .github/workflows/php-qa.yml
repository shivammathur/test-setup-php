name: PHP libpng artifact QA
on:
  push:
    branches: [test/libpng-1.6.59-20261002]
    paths: [php-matrix.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: echo "value=$(jq -c . php-matrix.json)" >> "$GITHUB_OUTPUT"
  php:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: winlibs/libpng
          ref: 7cda9e2cb293ca6320211891ae32a4c6f84f1365
          path: libpng-src
      - name: Verify and test exact PHP binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/php-qa.ps1 -Php '${{ matrix.php }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: php-${{ matrix.phase }}-${{ matrix.php }}
          path: reports
          if-no-files-found: error
