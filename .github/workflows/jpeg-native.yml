name: JPEG native artifact performance
on:
  workflow_dispatch:
  push:
    branches: [test/libjpeg-3.2.1-20261030]
    paths:
      - .github/workflows/jpeg-native.yml
      - native-plan.json
      - scripts/test-native.ps1
      - scripts/benchmark.py
      - tests/jpeg-bench.c
      - tests/jpeg-consumer.c
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: echo "matrix=$(jq -c '{include:.}' native-plan.json)" >> "$GITHUB_OUTPUT"
  native:
    needs: plan
    name: ${{ matrix.vs }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: winlibs/winlib-builder
          ref: 0a3eb556ea0a723e38ad93628c119195d170f25b
          path: builder
      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          repository: winlibs/winlib-builder
          run-id: ${{ matrix.candidate.run_id }}
          artifact-ids: ${{ matrix.candidate.artifact_id }}
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          merge-multiple: true
          path: candidate
      - name: Compute compiler inputs
        id: virtuals
        shell: powershell
        run: ./builder/scripts/compute-virtuals.ps1 -version '${{ matrix.php }}' -arch '${{ matrix.arch }}' -sdk '${{ matrix.sdk }}'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.sdk }}
      - name: Validate and benchmark installed libraries
        shell: pwsh
        run: ./scripts/test-native.ps1 -Vs '${{ matrix.vs }}' -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpeg-native-${{ matrix.vs }}-${{ matrix.arch }}
          path: reports
          if-no-files-found: warn
