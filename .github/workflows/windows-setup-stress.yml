    steps:
      - uses: actions/checkout@v7
      - name: Record runner details
        shell: pwsh
        run: .github/scripts/collect-setup-logs.ps1 -Before
      - name: Setup MySQL (original commands)
        shell: cmd
        run: |
          mysqld --initialize-insecure
          mysqld --install
          net start MySQL
          mysql --port=3306 --user=root --password="" -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'Password12!'; FLUSH PRIVILEGES;"
      - name: Setup MSSQL on D with download retries
        shell: pwsh
        run: .github/scripts/retry-choco.ps1
      - name: Verify SQL Server ODBC connection
        shell: pwsh
        run: .github/scripts/verify-sql.ps1
      - name: Verify 32-bit ODBC connection
        shell: pwsh
        run: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -NoProfile -File .github/scripts/verify-sql.ps1
      - name: Capture SQL setup and engine diagnostics
        if: always()
        shell: pwsh
        env:
          CAPTURE_FULL: ${{ job.status != 'success' }}
        run: .github/scripts/collect-setup-logs.ps1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: setup-${{ matrix.os }}-${{ matrix.attempt }}-${{ job.status }}
          path: ${{ runner.temp }}\setup-diagnostics
          retention-days: 14
          if-no-files-found: error
