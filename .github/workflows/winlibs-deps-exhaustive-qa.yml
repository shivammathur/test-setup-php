name: Investigate PHP source failures
run-name: PHP source failure investigation
on:
  workflow_dispatch:
    inputs:
      matrix:
        required: true
      focus:
        type: boolean
        default: false
      ffi-style:
        type: boolean
        default: false
      series-probe:
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  investigate:
    if: ${{ !inputs.series-probe }}
    name: PHP ${{ matrix.php }} diagnostic evidence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run_id }}
          name: artifacts
          path: artifacts
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ matrix.source_sha }}
          path: php-src
      - name: Install Windows debugger
        shell: pwsh
        run: ./scripts/install-debugger.ps1
      - name: Fetch matching libffi SDK for native controls
        run: python scripts/libffi-sdk.py '${{ matrix.php }}'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile x86 callback control
        shell: cmd
        run: cl /nologo /LD /Zi /Od /W4 native\callback.c /link /out:callback-x86.dll
      - name: Compile native x86 libffi control
        run: python scripts/libffi-sdk.py '${{ matrix.php }}' compile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile x64 callback control
        shell: cmd
        run: cl /nologo /LD /Zi /Od /W4 native\callback.c /link /out:callback-x64.dll
      - name: Run pinned-binary investigations
        run: python scripts/investigate.py --php '${{ matrix.php }}' --run-id '${{ matrix.run_id }}' --source-sha '${{ matrix.source_sha }}' ${{ inputs.focus && '--focus' || '' }} ${{ inputs.ffi-style && '--ffi-style' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.php }}-investigation
          path: reports
          if-no-files-found: error
  probe:
    if: inputs.series-probe
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025-vs2026]
        sample: [1, 2, 3, 4]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch standard series URLs using the builder request method
        shell: pwsh
        run: ./scripts/canonical-series-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-series-${{ matrix.runner }}-${{ matrix.sample }}
          path: reports/canonical-series
          if-no-files-found: error
