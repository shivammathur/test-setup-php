name: Zlib dependency PHP artifact QA
run-name: ${{ inputs.series-probe && 'Canonical staging series probe' || format('Zlib PHP QA ({0})', inputs.phase) }}
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: Exact PHP source-build artifact run IDs
        required: true
      source-suites:
        required: false
        type: boolean
        default: false
      phase:
        type: choice
        options: [candidate, published]
        default: candidate
      series-probe:
        description: Probe canonical series through normal Windows requests
        type: boolean
        default: false
      source-checks:
        description: Repeat selected source failures using pinned artifacts
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  test:
    if: ${{ !inputs.series-probe && !inputs.source-checks && !inputs.source-suites }}
    name: PHP ${{ matrix.php }} artifact QA
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download exact PHP artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run_id }}
          name: artifacts
          path: artifacts
      - name: Verify and exercise all four PHP runtime variants
        shell: pwsh
        run: ./scripts/php-qa.ps1 -ArtifactsDirectory artifacts -RunId '${{ matrix.run_id }}' -PhpTarget '${{ matrix.php }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.php }}-${{ inputs.phase }}
          path: reports
          if-no-files-found: error
  source-checks:
    if: inputs.source-checks
    name: PHP ${{ matrix.php }} selected source tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run_id }}
          name: artifacts
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ matrix.source_sha }}
          path: php-src
      - run: python scripts/source-checks.py --php '${{ matrix.php }}' --run '${{ matrix.run_id }}' --source-sha '${{ matrix.source_sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-checks-${{ matrix.php }}-${{ inputs.phase }}
          path: reports
          if-no-files-found: error
  probe:
    if: inputs.series-probe
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025-vs2026]
        sample: [1, 2, 3, 4]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch standard series URLs using the builder request method
        shell: pwsh
        run: ./scripts/canonical-series-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-series-${{ matrix.runner }}-${{ matrix.sample }}
          path: reports/canonical-series
          if-no-files-found: error
  source-suite:
    if: inputs.source-suites
    name: PHP ${{ matrix.php }} ${{ matrix.arch }} ${{ matrix.ts }} ${{ matrix.opcache }} ${{ matrix.test_type }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shivammathur/php-windows-builder
          ref: ${{ matrix.builder_sha }}
          path: builder
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.run_id }}
          name: artifacts
          path: artifacts
      - name: Verify exact runtime artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = Get-Content source-suite-hashes.json -Raw | ConvertFrom-Json -AsHashtable
          $rows = @()
          foreach ($entry in $expected['${{ matrix.run_id }}'].GetEnumerator()) {
            $file = Join-Path artifacts $entry.Key
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Artifact digest mismatch: $file" }
            $rows += @{ file = $entry.Key; sha256 = $actual }
          }
          if ($rows.Count -ne 4) { throw 'Expected four runtime archives' }
          $rows | ConvertTo-Json | Set-Content artifacts/artifact-hashes.json
      - name: Resolve dependency cache
        id: cache
        shell: pwsh
        run: |
          Import-Module ./builder/php/BuildPhp -Force
          $info = Get-DepsCacheInfo -PhpVersion '${{ matrix.php_version }}' -Arch '${{ matrix.arch }}' -LibsBuildRuns '${{ matrix.libs }}' -IncludeDefaultRunsKey
          Set-Content packages.txt -Value ($info.Packages -join "`n")
          Add-Content $env:GITHUB_OUTPUT "key=$($info.CacheKey)"
          Add-Content $env:GITHUB_OUTPUT "directory=$($info.CacheDir)"
      - uses: actions/cache@v4
        id: deps
        with:
          path: ${{ steps.cache.outputs.directory }}
          key: ${{ steps.cache.outputs.key }}-${{ hashFiles('packages.txt') }}
      - name: Repeat original complete source suite
        shell: pwsh
        env:
          DEPS_DIR: ${{ steps.cache.outputs.directory }}
          DEPS_CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
          LIBS_BUILD_RUNS: ${{ matrix.libs }}
          GITHUB_TOKEN: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./builder/php/BuildPhp -Force
          Set-Location artifacts
          Invoke-PhpTests -PhpVersion '${{ matrix.php_version }}' -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}' -Opcache '${{ matrix.opcache }}' -TestType '${{ matrix.test_type }}' -SourceRepository php/php-src -SourceRef '${{ matrix.source_sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-suite-${{ matrix.php }}-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.opcache }}-${{ matrix.test_type }}-${{ inputs.phase }}
          path: |
            artifacts/test-*.xml
            artifacts/test-*.log
            artifacts/artifact-hashes.json
          if-no-files-found: error
