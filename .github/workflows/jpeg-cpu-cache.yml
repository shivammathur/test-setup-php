name: JPEG CPU detection diagnosis
on:
  workflow_dispatch:
  push:
    branches: [test/libjpeg-3.2.1-20261030]
    paths:
      - .github/workflows/jpeg-cpu-cache.yml
      - patches/libjpeg-cpu-cache.patch
      - scripts/test-cpu-cache.ps1
      - tests/jpeg-cpu-cache.c
      - scripts/benchmark.py
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: echo "matrix=$(jq -c '{include:.}' native-plan.json)" >> "$GITHUB_OUTPUT"
  diagnose:
    needs: plan
    name: ${{ matrix.vs }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: winlibs/winlib-builder
          ref: 0a3eb556ea0a723e38ad93628c119195d170f25b
          path: builder
      - uses: actions/checkout@v6
        with:
          repository: winlibs/libjpeg
          ref: 5e31759d415fef210f96b75bab79fe22aa77680a
          path: jpeg-src
      - name: Apply existing build patch and diagnostic cache
        shell: pwsh
        run: |
          git -C jpeg-src apply --ignore-whitespace ../builder/patches/libjpeg.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C jpeg-src apply ../patches/libjpeg-cpu-cache.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          repository: winlibs/winlib-builder
          run-id: ${{ matrix.candidate.run_id }}
          artifact-ids: ${{ matrix.candidate.artifact_id }}
          github-token: ${{ secrets.PHP_WINDOWS_BUILDER_TOKEN || secrets.GH_TOKEN || github.token }}
          merge-multiple: true
          path: uncached
      - name: Compute compiler inputs
        id: virtuals
        shell: powershell
        run: ./builder/scripts/compute-virtuals.ps1 -version '${{ matrix.php }}' -arch '${{ matrix.arch }}' -sdk '${{ matrix.sdk }}'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
          sdk: ${{ matrix.sdk }}
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch != 'arm64'
      - name: Build and test diagnostic library
        shell: pwsh
        run: |
          cmake -S jpeg-src -B jpeg-build -G 'Visual Studio ${{ steps.virtuals.outputs.vsinst }}' -A '${{ steps.virtuals.outputs.msarch }}' -T '${{ steps.virtuals.outputs.msts }}' -DCMAKE_SYSTEM_VERSION='${{ matrix.sdk }}' -DCMAKE_INSTALL_PREFIX="$PWD/candidate" -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase -DWITH_JPEG8=1 -DWITH_CRT_DLL=1 -DENABLE_SHARED=0 -DWITH_TURBOJPEG=0 -DREQUIRE_SIMD=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build jpeg-build --config RelWithDebInfo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir jpeg-build --build-config RelWithDebInfo --output-on-failure --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install jpeg-build --config RelWithDebInfo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Diagnose CPU queries, concurrency, and performance
        shell: pwsh
        run: ./scripts/test-cpu-cache.ps1 -Vs '${{ matrix.vs }}' -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpeg-cpu-cache-${{ matrix.vs }}-${{ matrix.arch }}
          path: reports
          if-no-files-found: warn
