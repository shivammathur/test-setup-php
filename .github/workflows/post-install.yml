          - {"formula":"php@8.2-debug","version":"8.2","full_version":"8.2.33","revision":"1","suffix":"-debug","debug":"true","phpts":"nts","pear_directory":"pear@8.2-debug","shared_extensions":"opcache"}
          - {"formula":"php@8.2-zts","version":"8.2","full_version":"8.2.33","revision":"1","suffix":"-zts","debug":"false","phpts":"zts","pear_directory":"pear@8.2-zts","shared_extensions":"opcache"}
