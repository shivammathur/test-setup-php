          - {"formula":"php@8.3-debug","version":"8.3","full_version":"8.3.33","revision":"1","suffix":"-debug","debug":"true","phpts":"nts","pear_directory":"pear@8.3-debug","shared_extensions":"opcache"}
          - {"formula":"php@8.3-zts","version":"8.3","full_version":"8.3.33","revision":"1","suffix":"-zts","debug":"false","phpts":"zts","pear_directory":"pear@8.3-zts","shared_extensions":"opcache"}
          - {"formula":"php@8.3","version":"8.3","full_version":"8.3.33","revision":"1","suffix":"","debug":"false","phpts":"nts","pear_directory":"pear@8.3","shared_extensions":"opcache"}
          - {"formula":"php@8.4-debug-zts","version":"8.4","full_version":"8.4.25","revision":"1","suffix":"-debug-zts","debug":"true","phpts":"zts","pear_directory":"pear@8.4-debug-zts","shared_extensions":"opcache"}
          - {"formula":"php@8.4-debug","version":"8.4","full_version":"8.4.25","revision":"1","suffix":"-debug","debug":"true","phpts":"nts","pear_directory":"pear@8.4-debug","shared_extensions":"opcache"}
          - {"formula":"php@8.4-zts","version":"8.4","full_version":"8.4.25","revision":"1","suffix":"-zts","debug":"false","phpts":"zts","pear_directory":"pear@8.4-zts","shared_extensions":"opcache"}
          - {"formula":"php@8.4","version":"8.4","full_version":"8.4.25","revision":"1","suffix":"","debug":"false","phpts":"nts","pear_directory":"pear@8.4","shared_extensions":"opcache"}
    env:
      PHP_FORMULA: ${{ matrix.variant.formula }}
      PHP_VERSION: ${{ matrix.variant.version }}
      PHP_FULL_VERSION: ${{ matrix.variant.full_version }}
      PHP_REVISION: ${{ matrix.variant.revision }}
      PHP_SUFFIX: ${{ matrix.variant.suffix }}
      PHP_EXPECT_DEBUG: ${{ matrix.variant.debug }}
      PHP_EXPECT_ZTS: ${{ matrix.variant.phpts }}
      PHP_PEAR_DIRECTORY: ${{ matrix.variant.pear_directory }}
      PHP_SHARED_EXTENSIONS: ${{ matrix.variant.shared_extensions }}
      EXPECTED_TAP_COMMIT: 92592eeae09505d0a09b4db763f62e67bd153422
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure a fresh bottle installation
        shell: bash
        run: |
          set -euo pipefail
          if brew list --formula --versions "$PHP_FORMULA"; then
            brew uninstall --force "$PHP_FORMULA"
          fi

      - name: Install PHP through setup-php verbose
        uses: shivammathur/setup-php@verbose
        with:
          php-version: ${{ matrix.variant.version }}
          coverage: none
          tools: none
        env:
          debug: ${{ matrix.variant.debug }}
          phpts: ${{ matrix.variant.phpts }}
          update: 'true'
          fail-fast: 'true'

      - name: Verify bottle, post-install configuration, and channels
        shell: bash
        run: bash tests/post-install.sh

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.formula }}-${{ matrix.os }}-validation
          path: validation-logs/
          if-no-files-found: warn
