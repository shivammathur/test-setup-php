name: OpenSSL release artifact QA

on:
  push:
    branches: ['test/openssl-upgrade-20261002']
    paths:
      - 'qa-manifest.json'
      - '.github/scripts/Test-ReleaseArtifacts.ps1'
      - 'tests/snmp-roundtrip.php'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('qa-manifest.json').read_text())
          rows = manifest['php']
          assert {r['php'] for r in rows} <= {'8.2', '8.3', '8.4', '8.5', '8.6', 'master'}
          assert 1 <= len(rows) == len({r['php'] for r in rows}) <= 6
          for row in rows:
              assert row['runId'] and row['artifactId'] and len(row['artifactSha256']) == 64
              assert {(z['arch'], z['ts']) for z in row['runtimeZips']} == {
                  ('x64', 'ts'), ('x64', 'nts'), ('x86', 'ts'), ('x86', 'nts')
              }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('include=' + json.dumps([{'php': r['php'], 'runner': r['runner']} for r in rows]) + '\n')
          PY

  php-artifacts:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Verify and test exact PHP artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/Test-ReleaseArtifacts.ps1 -Php '${{ matrix.php }}'
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-qa-php-${{ matrix.php }}
          path: reports
          if-no-files-found: error
