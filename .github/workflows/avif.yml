name: Validate php-ubuntu AVIF fix
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  avif:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: shivammathur/php-ubuntu
          ref: 10bee666e146b4f794e47accf92774edc13acc1c
          path: php-ubuntu
      - name: Setup PHP from released cache
        uses: shivammathur/setup-php@64cefab514bc650c6afd09c7133b02d9910a49aa
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick
          coverage: none
          tools: none
      - name: Record baseline
        run: |
          mkdir -p results
          bash diagnostics.sh > results/before-fix.txt 2>&1
          php avif.php results/baseline > results/baseline.json || true
          cat results/baseline.json
      - name: Install codec dependencies using php-ubuntu fix
        run: |
          sudo bash php-ubuntu/scripts/install-imagick-dependencies.sh || {
            sudo apt-get update -qq -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            sudo bash php-ubuntu/scripts/install-imagick-dependencies.sh
          }
      - name: Verify AVIF and apt consistency
        run: |
          php php-ubuntu/scripts/test-imagick-avif.php
          php avif.php results/fixed | tee results/fixed.json
          file results/fixed.avif
          sudo apt-get check
          bash diagnostics.sh > results/after-fix.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avif-${{ matrix.php }}-${{ matrix.os }}
          path: results
