name: Verify PR 24246 path regressions

on:
  push:
    branches: [test/pr24246-path-regressions-20261108]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.source.variant }} ${{ matrix.ts }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source:
          - variant: parent
            sha: d5a94412e3635fd6537a922603b096b0d0c121eb
          - variant: pr
            sha: a360b048ca4e4e84c97a0444580549fd7ca33518
        ts: [ts, nts]
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.8.4
      PHP_BUILD_CRT: vs17
      PLATFORM: x64
      THREAD_SAFE: ${{ matrix.ts == 'ts' && '1' || '0' }}
      INTRINSICS: AVX2
      SOURCE_SHA: ${{ matrix.source.sha }}
      VARIANT: ${{ matrix.source.variant }}
      PHPTS: ${{ matrix.ts }}
    steps:
      - uses: actions/checkout@v6
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          repository: php/php-src
          ref: ${{ matrix.source.sha }}
          path: source
      - name: Build exact source and package runtime
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-${{ matrix.source.variant }}-${{ matrix.ts }}
          path: build.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.source.variant }}-${{ matrix.ts }}
          path: runtime/
          if-no-files-found: error

  verify:
    name: Compare ${{ matrix.os }} ${{ matrix.ts }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        ts: [ts, nts]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: php-*-${{ matrix.ts }}
          path: binaries
      - name: Compare native-verified fixtures with both PHP builds
        shell: pwsh
        env:
          PHPTS: ${{ matrix.ts }}
        run: ./verify.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.ts }}
          path: reports/
          if-no-files-found: error
