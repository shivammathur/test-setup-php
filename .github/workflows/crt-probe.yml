name: CRT environment compatibility and lookup cost
on:
  push:
    branches: [test/libjpeg-crt-compat-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Compile and run
        shell: pwsh
        run: |
          New-Item reports -ItemType Directory -Force | Out-Null
          cl /nologo /O2 /MD /W4 tests/crt-probe.c /Fe:crt-probe.exe
          if ($LASTEXITCODE) { throw 'Compile failed' }
          ./crt-probe.exe | Tee-Object reports/probe.json
          if ($LASTEXITCODE) { throw 'Probe failed' }
          $sdk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Source/*/ucrt/env/getenv.cpp' | Sort-Object FullName | Select-Object -Last 1
          if ($sdk) { Copy-Item $sdk.FullName reports/getenv.cpp }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-probe-${{ matrix.arch }}
          path: reports
