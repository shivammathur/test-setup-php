name: Check matching password tests for libzip PHP builds
on:
  push:
    branches: [test/libzip-source-drift-20261009]
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: ${{ matrix.source.branch }} ${{ matrix.arch }} ${{ matrix.ts }}
    runs-on: ${{ matrix.source.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [ts, nts]
        source:
          - {branch: PHP-8.5, run: '37920134758', runner: windows-2022}
          - {branch: PHP-8.6, run: '37920134764', runner: windows-2025-vs2026}
          - {branch: master, run: '37920134813', runner: windows-2025-vs2026}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          repository: shivammathur/php-windows-builder
          run-id: ${{ matrix.source.run }}
          name: artifacts
          path: artifacts
          github-token: ${{ github.token }}
      - name: Run source-matched password tests without loading ZIP
        shell: pwsh
        run: ./tests/check.ps1 -Branch '${{ matrix.source.branch }}' -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: password-${{ matrix.source.branch }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: results/
          if-no-files-found: error
