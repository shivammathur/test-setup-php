name: Profile full cache installation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  install:
    name: PHP ${{ matrix.php }} hosted Intel phases
    runs-on: macos-15-intel
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/php-darwin
          ref: 9139d8fc0b767ab2b4eb1950f79e69a3d8efb724
          path: php-darwin
          persist-credentials: false
      - name: Install the verified archive with phase diagnostics
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: python3 profile_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: install-phases-${{ matrix.php }}
          path: |
            install-results.json
            install.log
