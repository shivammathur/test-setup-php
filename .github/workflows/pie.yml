name: PIE helper smoke tests
on: push
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: pie, phpize, php-config
      - name: Unix binary and source modes
        if: runner.os != 'Windows'
        shell: bash
        run: bash fixtures/unix-smoke.sh
      - name: Windows binary installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fixtures/windows-smoke.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pie-${{ runner.os }}
          path: artifacts/
