name: Verify Intel Homebrew metadata refresh
on: [push]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: shivammathur/cache-extensions@c2d4a69703175ce0e3c5103b63225ebfa74d1a6f
        env:
          HOMEBREW_FORCE_API_AUTO_UPDATE: '1'
        with:
          php-version: '8.4'
          extensions: memcached
          key: intel-refresh-${{ github.run_id }}
      - run: |
          brew config
          for ext in igbinary msgpack; do test -s "$(cat "$RUNNER_TEMP/deps-dir")/$ext.so"; done
