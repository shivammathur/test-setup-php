name: Validate Intel extension bottles
on: [push]
permissions:
  contents: read
jobs:
  bottles:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - run: |
          brew tap shivammathur/extensions
          brew trust shivammathur/extensions
          for ext in igbinary msgpack; do
            formula="shivammathur/extensions/$ext@8.4"
            brew fetch --force-bottle "$formula"
            file=$(brew --cache --force-bottle "$formula")
            test -s "$file"
            tar -tf "$file" | grep -F "/$ext.so"
          done
