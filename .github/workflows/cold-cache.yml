name: Validate PHP Darwin cold and hot installs on hosted Intel
on:
  push:
    branches: [fix/php-darwin-cold-install-20260927]
  workflow_dispatch:
permissions:
  contents: read
env:
  HOMEBREW_DEVELOPER: '1'
  use_package_cache: 'true'
  PHP_DARWIN_TEST_INSTALLER: ${{ github.workspace }}/scripts/install.sh
jobs:
  setup-php:
    name: Install PHP ${{ '8.5' }} through setup-php on macos-15-intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      EXTENSIONS: ${{ format('{0}{1}', ('8.5' == '5.6' || '8.5' == '7.0') && 'xdebug' || 'xdebug, pcov', true && ', imagick, mongodb, memcached' || '') }}
      PHP_DARWIN_REQUIRE_PACKS: ${{ true }}
      PHP_DARWIN_REQUIRE_PCOV: ${{ ('8.5' == '5.6' || '8.5' == '7.0') && 'false' || 'true' }}
      PHP_DARWIN_REQUIRE_CACHE: 'true'
      PHP_DARWIN_REQUIRE_INSTALL_TIMING: 'true'
      PHP_DARWIN_REQUIRE_XDEBUG: 'true'
      PHP_VERSION: ${{ '8.5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/php-darwin
          ref: 7a7c3c418e07535ac10af071975d44fd112227d2
          persist-credentials: false

      - name: Remove unused Homebrew taps
        run: bash scripts/build/cleanup-taps.sh

      - name: Remove PHP for the cold setup-php path
        run: bash scripts/tests/helpers/remove-preinstalled-php.sh

      - name: Record preinstalled PHP and services
        run: bash scripts/tests/helpers/prepare-e2e.sh

      - name: Check setup-php's passwordless sudo prerequisite
        run: sudo -n true

      - name: Check out unchanged setup-php
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/setup-php
          ref: f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
          path: .setup-php
          persist-credentials: false

      - name: Preserve the Actions Node runtime
        uses: ./.github/actions/node-runtime

      - name: Install PHP and extensions through setup-php from cold
        # Stock setup-php needs a parent directory without "darwin". The helper
        # copies its dist/src verbatim; the repository and action stay unchanged.
        env:
          BASH_ENV: ${{ github.workspace }}/scripts/tests/helpers/trace-install-phases.sh
          INPUT_PHP-VERSION: ${{ '8.5' }}
          INPUT_EXTENSIONS: ${{ env.EXTENSIONS }}
          INPUT_INI-FILE: production
          INPUT_GITHUB-TOKEN: ${{ secrets.TOKEN || github.token }}
        run: '"$PHP_DARWIN_NODE" scripts/tests/helpers/run-setup-php.cjs .setup-php'

      - name: Verify the php-darwin cache installation
        run: bash scripts/tests/e2e/setup-php.test.sh

      - name: Run setup-php again on the hot path
        env:
          BASH_ENV: ${{ github.workspace }}/scripts/tests/helpers/trace-install-phases.sh
          INPUT_PHP-VERSION: ${{ '8.5' }}
          INPUT_EXTENSIONS: ${{ env.EXTENSIONS }}
          INPUT_INI-FILE: production
          INPUT_GITHUB-TOKEN: ${{ secrets.TOKEN || github.token }}
        run: '"$PHP_DARWIN_NODE" scripts/tests/helpers/run-setup-php.cjs .setup-php'

      - name: Verify the hot installation
        run: bash scripts/tests/e2e/setup-php.test.sh

      - name: Update Homebrew after the cache installation
        run: brew update

      - name: Preserve cache installer diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-php-${{ '8.5' }}-macos-15-intel
          path: |
            ${{ runner.temp }}/php-darwin-setup-install.log
            ${{ runner.temp }}/php-darwin-setup-install-seconds.txt
          if-no-files-found: ignore
          retention-days: 7
