name: PR 1138 real PHPUnit validation
on:
  push:
    branches: [fix/pr1138-phpunit-real-20261022]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
env:
  EXPECTED_ACTION_SHA: b28890bfba806470b7935852428699105c8a3036
jobs:
  real:
    name: PHPUnit ${{ matrix.phpunit }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        phpunit: ['9', '10', '11', '12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/setup-php
          ref: b28890bfba806470b7935852428699105c8a3036
          path: .setup-php
      - uses: ./.setup-php
        with:
          php-version: '8.4'
          coverage: none
          tools: phpunit:${{ matrix.phpunit }}
      - name: Verify installed matcher
        run: node .github/tests/phpunit-matchers/exercise.cjs verify
      - name: Register matchers in separate step
        shell: bash
        run: echo "::add-matcher::$RUNNER_TOOL_CACHE/phpunit.json"
      - name: Real fixtures with separate-step registration and removal
        run: node .github/tests/phpunit-matchers/exercise.cjs real normal ${{ matrix.phpunit }}
      - name: Real fixtures with same-step registration and removal
        run: node .github/tests/phpunit-matchers/exercise.cjs real same-step ${{ matrix.phpunit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-${{ matrix.os }}-phpunit-${{ matrix.phpunit }}
          path: evidence/
          if-no-files-found: error
  audit:
    name: Verify GitHub annotations
    needs: [real]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert exact live annotations and absence after removal
        run: node .github/tests/phpunit-matchers/audit.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verified-annotations
          path: verified-results.json
          if-no-files-found: error
