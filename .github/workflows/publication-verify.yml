name: Verify canonical libpng publication
on:
  push:
    branches: [test/libpng-1.6.59-20261002]
    paths: [publication-matrix.json, scripts/verify-publication.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify-publication.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-publication
          path: publication-reports
          if-no-files-found: error
