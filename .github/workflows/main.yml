name: GH-25213 Windows OPcache regression
run-name: GH-25213 ${{ inputs.build-run-id && format('comparison with build {0}', inputs.build-run-id) || 'release baseline' }}
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: php-windows-builder run containing the fixed artifacts
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  wait-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for completed and validated build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          if [[ -z "$BUILD_RUN_ID" ]]; then exit 0; fi
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 150); do
            run=$(gh api "repos/shivammathur/php-windows-builder/actions/runs/$BUILD_RUN_ID")
            if [[ $(jq -r .path <<< "$run") != '.github/workflows/test-php-libs-from-source.yml' ]]; then
              echo 'Unexpected source-build workflow'; exit 1
            fi
            jobs=$(gh api "repos/shivammathur/php-windows-builder/actions/runs/$BUILD_RUN_ID/jobs?per_page=100")
            if [[ $(jq '[.jobs[] | select(.name == "artifacts" and .conclusion == "success")] | length' <<< "$jobs") == 1 ]]; then
              exit 0
            fi
            if [[ $(jq -r .status <<< "$run") == completed ]]; then
              echo 'Build completed without merged artifacts'; exit 1
            fi
            echo "Waiting for builder run $BUILD_RUN_ID (poll $attempt)"
            sleep 45
          done
          echo 'Timed out waiting for build artifacts'; exit 1
  platform-guard:
    if: ${{ inputs.build-run-id != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: 743f3d968ee9d780fc9c5455d3f8c8298ce292d1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify regression is Windows only
        shell: bash
        run: |
          php -n run-tests.php -n -q ext/opcache/tests/jit/gh25213.phpt | tee guard.log
          grep -q 'reason: Windows only' guard.log
      - uses: actions/upload-artifact@v7
        with:
          name: gh25213-platform-guard-${{ matrix.os }}
          path: guard.log
  regression:
    needs: wait-builder
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [ts, nts]
    steps:
      - uses: actions/checkout@v6
      - name: Install latest PHP 8.4 Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force results | Out-Null
          $releases = Invoke-RestMethod 'https://windows.php.net/downloads/releases/releases.json'
          $release = $releases.'8.4'
          if ($release.version -ne '8.4.27-1') { throw "Baseline changed: $($release.version)" }
          $package = $release.'${{ matrix.ts }}-vs17-${{ matrix.arch }}'.zip
          $url = "https://windows.php.net/downloads/releases/$($package.path)"
          Invoke-WebRequest $url -OutFile baseline.zip
          $hash = (Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $package.sha256) { throw 'Official baseline checksum mismatch' }
          Expand-Archive baseline.zip runtime/baseline
          @{ version=$release.version; url=$url; sha256=$hash; manifest=$release } |
            ConvertTo-Json -Depth 8 | Set-Content results/baseline-provenance.json
      - name: Reproduce release crash and verify controls
        shell: pwsh
        run: ./scripts/test.ps1 -Php runtime/baseline/php.exe -Label baseline -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}' -ExpectBug
      - name: Download fixed build artifacts
        if: ${{ inputs.build-run-id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: downloads/fixed
          repository: shivammathur/php-windows-builder
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}
      - name: Verify and extract fixed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ inputs.build-run-id != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = if ('${{ matrix.ts }}' -eq 'nts') { '-nts' } else { '' }
          $pattern = '^php-8\.4\.[0-9]+(?:-dev)?' + $suffix + '-Win32-vs17-${{ matrix.arch }}\.zip$'
          $archives = @(Get-ChildItem downloads/fixed/*.zip | Where-Object Name -Match $pattern)
          if ($archives.Count -ne 1) { throw 'Expected exactly one fixed runtime archive' }
          $archive = $archives[0]
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $runId = '${{ inputs.build-run-id }}'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json' }
          $api = "https://api.github.com/repos/shivammathur/php-windows-builder/actions/runs/$runId"
          $run = Invoke-RestMethod $api -Headers $headers
          if ($run.path -ne '.github/workflows/test-php-libs-from-source.yml' -or $run.head_branch -ne 'master') {
            throw 'Unexpected build workflow or branch'
          }
          $jobs = Invoke-RestMethod "$api/jobs?per_page=100" -Headers $headers
          $resolver = @($jobs.jobs | Where-Object { $_.name -eq 'resolve-runner' -and $_.conclusion -eq 'success' })
          if ($resolver.Count -ne 1) { throw 'Missing successful source resolution job' }
          $logUrl = "https://api.github.com/repos/shivammathur/php-windows-builder/actions/jobs/$($resolver[0].id)/logs"
          $log = (Invoke-WebRequest $logUrl -Headers $headers).Content
          $sourceSha = '743f3d968ee9d780fc9c5455d3f8c8298ce292d1'
          if ($log -notmatch "(?m)^\S+\s+$sourceSha\s*$" -or $log -notmatch 'repository: shivammathur/php-src') {
            throw 'Builder source commit or repository does not match the fix'
          }
          $log | Set-Content results/source-resolution.log
          @{ source_sha=$sourceSha; source_repository='shivammathur/php-src'; build_run=$runId;
             builder_sha=$run.head_sha; runtime_archive=$archive.Name; runtime_sha256=$hash;
             arch='${{ matrix.arch }}'; ts='${{ matrix.ts }}' } |
            ConvertTo-Json | Set-Content results/fixed-provenance.json
          Expand-Archive $archive.FullName runtime/fixed
      - name: Verify fixed artifacts with identical workloads
        if: ${{ inputs.build-run-id != '' }}
        shell: pwsh
        run: ./scripts/test.ps1 -Php runtime/fixed/php.exe -Label fixed -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - name: Checkout exact regression source
        uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: 743f3d968ee9d780fc9c5455d3f8c8298ce292d1
          path: source
      - name: Confirm PHPT fails before and passes after the fix
        if: ${{ inputs.build-run-id != '' }}
        shell: pwsh
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($label in @('baseline', 'fixed')) {
            $php = (Resolve-Path "runtime/$label/php.exe").Path
            $dll = (Resolve-Path "runtime/$label/ext/php_opcache.dll").Path
            $env:TEST_PHP_EXECUTABLE = $php
            $env:TEST_PHP_JUNIT = "$env:GITHUB_WORKSPACE/results/$label-phpt.xml"
            & $php -n source/run-tests.php -n -d "zend_extension=$dll" -d opcache.enable_cli=1 -q --no-color --show-diff `
              source/ext/opcache/tests/jit/gh25213.phpt | Tee-Object "results/$label-phpt.txt"
            $exitCode = $LASTEXITCODE
            $expected = if ($label -eq 'baseline') { 'FAIL GH-25213' } else { 'PASS GH-25213' }
            if (!(Select-String -Quiet -Path "results/$label-phpt.txt" -Pattern $expected) -or
                ($label -eq 'fixed' -and $exitCode -ne 0) -or ($label -eq 'baseline' -and $exitCode -eq 0)) {
              throw "Unexpected $label PHPT result: $exitCode"
            }
            Get-ChildItem source/ext/opcache/tests/jit/gh25213.* |
              Where-Object Extension -In @('.out', '.diff', '.log') |
              Copy-Item -Destination "results/$label/"
          }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh25213-results-${{ matrix.arch }}-${{ matrix.ts }}
          path: results
          if-no-files-found: error
