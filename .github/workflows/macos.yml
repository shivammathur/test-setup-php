          composer-flags: ''
          composer-minimum-stability: ''
          run-tests: ''
          PHP_CS_FIXER_IGNORE_ENV: ''
          collect-code-coverage: ''
          phpunit-flags: ''
          run-migration-rules: ''
          execute-flex-with-symfony-version: ''
        - operating-system: macos-latest
          php-version: '8.5'
          job-description: tests on macOS
          run-tests: 'yes'
          AVOID_PARAUNIT: ''
          run-mutation-tests: ''
          PHP_CS_FIXER_FAST_LINT_TEST_CASES: ''
          composer-flags: ''
          run-fixer: ''
          composer-minimum-stability: ''
          PHP_CS_FIXER_IGNORE_ENV: ''
          collect-code-coverage: ''
          phpunit-flags: ''
          run-migration-rules: ''
          execute-flex-with-symfony-version: ''
    name: control / PHP ${{ matrix.php-version }} ${{ matrix.job-description }}
    runs-on: ${{ matrix.operating-system }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
