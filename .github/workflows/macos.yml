name: panther macOS PHP cache comparison
'on':
  push:
    branches:
    - feature/macos-cache-panther-20260930
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  beta:
    runs-on: macos-latest
    name: beta / PHP 8.5 Test on macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        repository: symfony/panther
        ref: 150f38fc00441a3fa5dd7d5c913f87e2be3872ac
        persist-credentials: false
    - name: Setup PHP
      uses: shivammathur/setup-php@2.40.0-beta
      with:
        php-version: '8.5'
        extensions: zip
    - name: Inspect PHP runtime and build tools
      if: always()
      shell: bash
      run: |
        set +e
        uname -m
        sw_vers
        command -v php phpize php-config composer
        php -v
        php --ini
        php -m
        phpize --version
        php-config --version
        php-config --extension-dir
        php-config --includes
        otool -L "$(command -v php)"
        exit 0
    - name: Install Firefox
      run: brew install --cask firefox
    - name: Install Geckodriver
      run: brew install geckodriver
    - name: Install dependencies
      uses: ramsey/composer-install@v3
    - name: Run tests
      run: vendor/bin/simple-phpunit
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      verbose: 'true'
      use_package_cache: 'true'
      COMPOSER_ROOT_VERSION: dev-main
  control:
    runs-on: macos-latest
    name: control / PHP 8.5 Test on macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        repository: symfony/panther
        ref: 150f38fc00441a3fa5dd7d5c913f87e2be3872ac
        persist-credentials: false
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: zip
    - name: Inspect PHP runtime and build tools
      if: always()
      shell: bash
      run: |
        set +e
        uname -m
        sw_vers
        command -v php phpize php-config composer
        php -v
        php --ini
        php -m
        phpize --version
        php-config --version
        php-config --extension-dir
        php-config --includes
        otool -L "$(command -v php)"
        exit 0
    - name: Install Firefox
      run: brew install --cask firefox
    - name: Install Geckodriver
      run: brew install geckodriver
    - name: Install dependencies
      uses: ramsey/composer-install@v3
    - name: Run tests
      run: vendor/bin/simple-phpunit
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      verbose: 'true'
      use_package_cache: 'false'
      COMPOSER_ROOT_VERSION: dev-main
