name: easyadmin macOS PHP cache comparison
'on':
  push:
    branches:
    - feature/macos-cache-easyadmin-20260930
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  beta:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          php_version: '8.4'
          symfony_version: 7.4.*
          stability: stable
          allow_failure: false
          composer_args: ''
          symfony_deprecations_helper: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: EasyCorp/EasyAdminBundle
        ref: db9e18886d900dc5ddd20fe184ccd4154c60e83e
        persist-credentials: false
    - name: Setup PHP - Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@2.40.0-beta
      with:
        php-version: ${{ matrix.php_version }}
        coverage: none
        extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3, fileinfo
        ini-values: date.timezone=UTC
        tools: composer:2.9.8
    - name: Inspect PHP runtime and build tools
      if: always()
      shell: bash
      run: |
        set +e
        uname -m
        sw_vers
        command -v php phpize php-config composer
        php -v
        php --ini
        php -m
        phpize --version
        php-config --version
        php-config --extension-dir
        php-config --includes
        otool -L "$(command -v php)"
        exit 0
    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-${{ matrix.symfony_version || 'default' }}-${{ matrix.composer_args
          || 'normal' }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
        restore-keys: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-
    - name: symfony/flex is required to install the correct symfony version
      if: ${{ matrix.symfony_version }}
      run: |
        composer global config --no-plugins allow-plugins.symfony/flex true
        composer global require symfony/flex
    - name: Configure Composer stability
      run: |
        composer config minimum-stability ${{ matrix.stability }}
    - name: Configure Symfony version for symfony/flex
      if: ${{ matrix.symfony_version }}
      run: composer config extra.symfony.require "${{ matrix.symfony_version }}"
    - name: Disable Composer audit feature
      run: |
        composer config audit.block-insecure false
    - name: Install dependencies
      run: |
        composer update --no-interaction --no-progress --prefer-dist ${{ matrix.composer_args }}
        vendor/bin/simple-phpunit install
    - name: Show installed dependencies
      run: |
        composer show
    - name: Run tests
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        set +e
        make tests
        exit_code=$?

        if [ "${{ matrix.allow_failure }}" = "true" ] && [ $exit_code -ne 0 ]; then
            echo "::warning::Experimental job failed (php ${{ matrix.php_version }}, symfony ${{ matrix.symfony_version }}), but it's allowed to fail."
            exit 0
        fi

        exit $exit_code
      env:
        SYMFONY_DEPRECATIONS_HELPER: ${{ matrix.symfony_deprecations_helper || '' }}
    - name: Run tests (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $cacheDir = php -r "echo sys_get_temp_dir();"
        $cacheDir = Join-Path $cacheDir "com.github.easycorp.easyadmin/tests/var/test/cache"
        if (Test-Path $cacheDir) { Remove-Item -Recurse -Force $cacheDir }
        if (-not $env:SYMFONY_DEPRECATIONS_HELPER) { $env:SYMFONY_DEPRECATIONS_HELPER = "ignoreFile=./tests/baseline-ignore.txt" }
        php vendor/bin/simple-phpunit -v
        $exitCode = $LASTEXITCODE

        if ("${{ matrix.allow_failure }}" -eq "true" -and $exitCode -ne 0) {
            Write-Output "::warning::Experimental job failed (php ${{ matrix.php_version }}, symfony ${{ matrix.symfony_version }}), but it's allowed to fail."
            exit 0
        }

        exit $exitCode
      env:
        SYMFONY_DEPRECATIONS_HELPER: ${{ matrix.symfony_deprecations_helper || '' }}
    permissions:
      contents: read
    name: beta / phpunit
    env:
      verbose: 'true'
      use_package_cache: 'true'
      COMPOSER_ROOT_VERSION: 5.x-dev
  control:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          php_version: '8.4'
          symfony_version: 7.4.*
          stability: stable
          allow_failure: false
          composer_args: ''
          symfony_deprecations_helper: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: EasyCorp/EasyAdminBundle
        ref: db9e18886d900dc5ddd20fe184ccd4154c60e83e
        persist-credentials: false
    - name: Setup PHP - Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_version }}
        coverage: none
        extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3, fileinfo
        ini-values: date.timezone=UTC
        tools: composer:2.9.8
    - name: Inspect PHP runtime and build tools
      if: always()
      shell: bash
      run: |
        set +e
