      with:
        cache-dependency-path: LICENSE
        go-version: ${{ env.GO_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' mise ') }}
      name: Install mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        add_shims_to_path: false
        cache: false
        env: false
        install: false
        version: ${{ env.MISE_VERSION }}
        working_directory: ${{ runner.temp }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' lua ') }}
      name: Install Lua
      uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377
      with:
        luaVersion: ${{ env.LUA_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' lua ') }}
      name: Install LuaRocks
      uses: luarocks/gh-actions-luarocks@86ccbcad8c77b22e94c96a2a08632192e2bcd62b
      with:
        luaRocksVersion: ${{ env.LUAROCKS_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' ruby ') }}
      name: Install Ruby
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' php ') }}
      name: Setup PHP - Install PHP and Composer
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        coverage: none
        php-version: ${{ env.PHP_VERSION }}
        tools: composer
    - name: Inspect PHP runtime and build tools
      if: always()
