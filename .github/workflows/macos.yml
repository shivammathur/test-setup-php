      name: Setup MSVC
      run: ./scripts/setup-msvc.ps1
      shell: pwsh
    - if: ${{ contains(format(' {0} ', matrix.languages), ' python ') }}
      name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        version: ${{ env.UV_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' python ') }}
      name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' node ') }}
      name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        cache: npm
        cache-dependency-path: LICENSE
        node-version: ${{ env.NODE_VERSION }}
    - if: ${{ contains(format(' {0} ', matrix.languages), ' golang ') }}
      name: Install Go
