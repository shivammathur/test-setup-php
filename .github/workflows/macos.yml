        sw_vers
        command -v php phpize php-config composer
        php -v
        php --ini
        php -m
        phpize --version
        php-config --version
        php-config --extension-dir
        php-config --includes
        otool -L "$(command -v php)"
        exit 0
    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-${{ matrix.symfony_version || 'default' }}-${{ matrix.composer_args
          || 'normal' }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
        restore-keys: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-
    - name: symfony/flex is required to install the correct symfony version
      if: ${{ matrix.symfony_version }}
      run: |
        composer global config --no-plugins allow-plugins.symfony/flex true
        composer global require symfony/flex
    - name: Configure Composer stability
      run: |
        composer config minimum-stability ${{ matrix.stability }}
    - name: Configure Symfony version for symfony/flex
      if: ${{ matrix.symfony_version }}
      run: composer config extra.symfony.require "${{ matrix.symfony_version }}"
    - name: Disable Composer audit feature
      run: |
