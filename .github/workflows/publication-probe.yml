name: Verify canonical Winlibs publication on Windows
on:
  push:
    branches: [test/apache-2.4.71-20261113]
    paths: [.github/workflows/publication-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - name: Verify standard consumer URLs and timestamps
        shell: pwsh
        run: ./scripts/verify-publication.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-${{ matrix.runner }}
          path: reports
          if-no-files-found: error
