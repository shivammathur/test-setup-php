name: Cache extensions 1.15.0 cross-workflow restore

on:
  push:
    branches:
      - test/cache-extensions-1.15.0-20260811

permissions:
  contents: read

env:
  CACHE_BUSTER: cache-extensions-1.15.0-31447419082-1

jobs:
  workflow-cache:
    name: Restore workflow scope (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: default
            jobs: 'false'
            workflows: 'false'
            workflow_hit: 'false'
          - name: jobs
            jobs: 'true'
            workflows: 'false'
            workflow_hit: 'false'
          - name: workflows
            jobs: 'false'
            workflows: 'true'
            workflow_hit: 'true'
          - name: both
            jobs: 'true'
            workflows: 'true'
            workflow_hit: 'true'
    steps:
      - name: Configure sharing flags
        if: matrix.case.name != 'default'
        shell: bash
        run: |
          printf '%s=%s\n' 'share-cache-across-jobs' '${{ matrix.case.jobs }}' >> "$GITHUB_ENV"
          printf '%s=%s\n' 'share-cache-across-workflows' '${{ matrix.case.workflows }}' >> "$GITHUB_ENV"

      - name: Compute cache metadata
        id: metadata
        uses: shivammathur/cache-extensions@1.15.0
        with:
          php-version: '5.4'
          extensions: ':opcache'
          key: ${{ env.CACHE_BUSTER }}-workflows-${{ matrix.case.name }}

      - name: Look up workflow marker
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/workflow-scope-marker
          key: ${{ steps.metadata.outputs.key }}
          lookup-only: true

      - name: Verify workflow-scope behavior
        shell: bash
        run: |
          expected='${{ matrix.case.workflow_hit }}'
          actual='${{ steps.restore.outputs.cache-hit }}'
          if [ "$expected" = 'true' ]; then
            test "$actual" = 'true'
          else
            test "$actual" != 'true'
          fi
