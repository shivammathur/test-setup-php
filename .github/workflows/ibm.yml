name: IBM installer diagnostics
on:
  push:
jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-22.04]
        php-versions: ['8.0']
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Setup cache environment
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_ibm, ibm_db2
          key: cache-v5-2.40.1

      - name: Cache extensions
        uses: actions/cache@v5.0.3
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@e8d4e43a6ea86e0a118fd08e31bf6518c80cd376
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_ibm, ibm_db2
        env:
          verbose: vv

      - name: Testing PHP version
        run: php -v

      - name: Testing Extensions
        run: |
          php -m
          php -r "if(! extension_loaded('pdo_ibm')) {throw new Exception('pdo_ibm not found');}"
          php -r "if(! extension_loaded('ibm_db2')) {throw new Exception('ibm_db2 not found');}"

      - name: Inspect IBM driver and download access
        if: always()
        run: |
          curl -IL --max-time 30 -w '\nHTTP %{http_code}, peer %{remote_ip}\n' https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz || true
          ls -lh /opt/ibm/clidriver/lib/libdb2.so* /opt/ibm/clidriver/include/sqlcli1.h || true
          ldd /opt/ibm/clidriver/lib/libdb2.so || true
          php -d display_startup_errors=1 -m
