name: Published PHP 5 setup-php checks
run-name: PHP 5 release smoke ${{ inputs.ticket }}
on:
  push:
    branches: [feature/php5-release-smoke-20261021]
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m compileall -q scripts
  smoke:
    if: github.event_name == 'workflow_dispatch'
    name: PHP ${{ matrix.php }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '5.4', '5.5']
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm, macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PHP_SERIES: ${{ matrix.php }}
      RUNNER_LABEL: ${{ matrix.runner }}
      GH_TOKEN: ${{ github.token }}
      update: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public publication metadata
        run: python3 scripts/check.py before
      - name: Install published PHP with setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Check installed bytes, startup, extensions and SAPIs
        run: python3 scripts/check.py base
      - name: Install published Imagick with setup-php
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: imagick
      - name: Check Imagick and extension inventory
        if: runner.os == 'macOS'
        run: python3 scripts/check.py imagick
      - name: Save smoke report
        run: python3 scripts/check.py finish
      - name: Retain logs and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-${{ matrix.php }}-${{ matrix.runner }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 90
