name: Versioned extension cache comparison

on:
  push:
    branches:
      - test/versioned-extension-cache-20260819
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.1'
  EXTENSIONS: redis-5.3.7, memcached-3.3.0

jobs:
  seed:
    name: Seed / ${{ matrix.os-name }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-24.04, windows-2022, macos-15-intel]
        variant: [fixed, v2]
        include:
          - operating-system: ubuntu-24.04
            os-name: Linux
            memcached-libs: libmemcached-dev libevent-dev
          - operating-system: windows-2022
            os-name: Windows
            memcached-libs: ''
          - operating-system: macos-15-intel
            os-name: macOS
            memcached-libs: libmemcached libevent

    steps:
      - name: Compute fixed cache metadata
        if: matrix.variant == 'fixed'
        id: metadata-fixed
        uses: shivammathur/cache-extensions@fix/versioned-extension-dependencies
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          key: versioned-extension-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
        env:
          share-cache-across-jobs: true

      - name: Compute v2 cache metadata
        if: matrix.variant == 'v2'
        id: metadata-v2
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: redis, memcached
          key: versioned-extension-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
        env:
          share-cache-across-jobs: true

      - name: Start setup timer
        id: setup-start
        shell: pwsh
        run: |
          "milliseconds=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup PHP using fixed branches
        if: matrix.variant == 'fixed'
        uses: shivammathur/test-setup-php@test/versioned-extension-cache-20260819
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
        env:
          fail-fast: true
          MEMCACHED_LIBS: ${{ matrix.memcached-libs }}

      - name: Setup PHP using v2
        if: matrix.variant == 'v2'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
        env:
          fail-fast: true
          MEMCACHED_LIBS: ${{ matrix.memcached-libs }}

      - name: Report seed duration
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [long]'${{ steps.setup-start.outputs.milliseconds }}'
          "### Seed: ${{ matrix.os-name }} / ${{ matrix.variant }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Setup PHP: **$elapsed ms**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify exact extension versions
        shell: php {0}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          <?php
          $expected = ['redis' => '5.3.7', 'memcached' => '3.3.0'];
          foreach ($expected as $extension => $version) {
              $actual = phpversion($extension);
              if ($actual !== $version) {
                  throw new RuntimeException("Expected $extension $version, got ".var_export($actual, true));
              }
          }
          if (getenv('VARIANT') === 'fixed') {
              $cacheDirectory = ini_get('extension_dir').DIRECTORY_SEPARATOR.'.setup-php-cache';
              foreach ($expected as $extension => $version) {
                  $cached = $cacheDirectory.DIRECTORY_SEPARATOR."$extension-$version";
                  if (!is_file($cached)) {
                      throw new RuntimeException("Missing protected extension cache: $cached");
                  }
              }
          }

      - name: Save fixed extension cache
        if: matrix.variant == 'fixed'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.metadata-fixed.outputs.dir }}
          key: ${{ steps.metadata-fixed.outputs.key }}

      - name: Save v2 extension cache
        if: matrix.variant == 'v2'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.metadata-v2.outputs.dir }}
          key: ${{ steps.metadata-v2.outputs.key }}

  restore:
    name: Restore / ${{ matrix.os-name }} / ${{ matrix.variant }}
    needs: seed
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-24.04, windows-2022, macos-15-intel]
        variant: [fixed, v2]
        include:
          - operating-system: ubuntu-24.04
            os-name: Linux
            memcached-libs: libmemcached-dev libevent-dev
          - operating-system: windows-2022
            os-name: Windows
            memcached-libs: ''
          - operating-system: macos-15-intel
            os-name: macOS
            memcached-libs: libmemcached libevent

    steps:
      - name: Compute fixed cache metadata
        if: matrix.variant == 'fixed'
        id: metadata-fixed
        uses: shivammathur/cache-extensions@fix/versioned-extension-dependencies
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          key: versioned-extension-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
        env:
          share-cache-across-jobs: true

      - name: Compute v2 cache metadata
        if: matrix.variant == 'v2'
        id: metadata-v2
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: redis, memcached
          key: versioned-extension-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
        env:
          share-cache-across-jobs: true

      - name: Restore fixed extension cache
        if: matrix.variant == 'fixed'
        id: restore-fixed
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.metadata-fixed.outputs.dir }}
          key: ${{ steps.metadata-fixed.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore v2 extension cache
        if: matrix.variant == 'v2'
        id: restore-v2
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.metadata-v2.outputs.dir }}
          key: ${{ steps.metadata-v2.outputs.key }}
          fail-on-cache-miss: true

      - name: Verify protected cache before setup
        if: matrix.variant == 'fixed'
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path '${{ steps.metadata-fixed.outputs.dir }}' '.setup-php-cache'
          @('redis-5.3.7', 'memcached-3.3.0') | ForEach-Object {
            $cached = Join-Path $cacheDirectory $_
            if(-not(Test-Path -LiteralPath $cached -PathType Leaf)) {
              throw "Missing protected extension cache before setup: $cached"
            }
          }

      - name: Start setup timer
        id: setup-start
        shell: pwsh
        run: |
          "milliseconds=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup PHP using fixed branches
        if: matrix.variant == 'fixed'
        uses: shivammathur/test-setup-php@test/versioned-extension-cache-20260819
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
        env:
          fail-fast: true
          MEMCACHED_LIBS: ${{ matrix.memcached-libs }}

      - name: Setup PHP using v2
        if: matrix.variant == 'v2'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
        env:
          fail-fast: true
          MEMCACHED_LIBS: ${{ matrix.memcached-libs }}

      - name: Report restore duration
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [long]'${{ steps.setup-start.outputs.milliseconds }}'
          "### Restore: ${{ matrix.os-name }} / ${{ matrix.variant }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Setup PHP: **$elapsed ms**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify exact extension versions
        shell: php {0}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          <?php
          $expected = ['redis' => '5.3.7', 'memcached' => '3.3.0'];
          foreach ($expected as $extension => $version) {
              $actual = phpversion($extension);
              if ($actual !== $version) {
                  throw new RuntimeException("Expected $extension $version, got ".var_export($actual, true));
              }
          }
          if (getenv('VARIANT') === 'fixed') {
              $cacheDirectory = ini_get('extension_dir').DIRECTORY_SEPARATOR.'.setup-php-cache';
              foreach ($expected as $extension => $version) {
                  $cached = $cacheDirectory.DIRECTORY_SEPARATOR."$extension-$version";
                  if (!is_file($cached)) {
                      throw new RuntimeException("Missing protected extension cache after setup: $cached");
                  }
              }
          }
