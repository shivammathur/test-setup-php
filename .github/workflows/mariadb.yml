name: Validate MariaDB PGO update
on: [push, workflow_dispatch]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  mariadb:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        version: ['10.11.18', '10.11.19']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shivammathur/php-sdk-binary-tools
          ref: e7544853173f58a7d176519b2116a79ab1b53f55
          path: sdk
      - name: Test SDK download, initialization, queries, import and shutdown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (Resolve-Path sdk).Path
          New-Item -ItemType Directory -Force results | Out-Null
          & "$sdk/bin/php/php.exe" -c "$sdk/bin/php/php.ini" -d "extension_dir=$sdk/bin/php/ext" ./test-mariadb.php $sdk '${{ matrix.version }}' 2>&1 | Tee-Object results/smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'MariaDB PGO validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-${{ matrix.version }}-${{ matrix.os }}
          path: |
            results/
            sdk/pgo/work/server/mariadb/data/*.err
