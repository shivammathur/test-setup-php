name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.4
          
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@verbose
        with:
          php-version: ${{ matrix.php-version }}
      - run: |
          php -v
          php -m
      
  
