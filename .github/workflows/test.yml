name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [5.3, 5.4, 5.5, 5.6, 7.0, 7.1, 7.4, 8.0, 8.2, 8.4, 8.5, 8.6, 8.7]
          
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - run: |         
          php -v
          php -m
      
  
