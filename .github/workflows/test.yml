name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        php: [8.3]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpstan:1, phpcs, phpcbf, phplint, cs2pr
      - run: |
          phplint -V
          php -v
          php -m
      
  
