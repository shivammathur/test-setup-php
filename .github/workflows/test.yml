name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [windows-latest]
        php: [7.2, 7.4, 8.0, 8.1, 8.3, 8.5]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@develop
        with:
          extensions: rrd
          php-version: ${{ matrix.php }}
      - run: |
          php -r "echo phpversion('rrd');"
          php -v
          php -m
      
  
