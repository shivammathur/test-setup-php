name: ASAN runtime environment
on: push
permissions:
  contents: read
jobs:
  asan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
    steps:
      - uses: shivammathur/setup-php@12f87e27b47f4db026232637a771d5d5af059819
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          asan: 'true'
      - name: Verify ASAN PHP in a new step
        shell: bash
        run: |
          set -euo pipefail
          test "$ASAN_OPTIONS" = detect_leaks=0
          test "$UBSAN_OPTIONS" = halt_on_error=1
          test "$ZEND_DONT_UNLOAD_MODULES" = 1
          test "$USE_ZEND_ALLOC" = 0
          [[ $(php-config --extension-dir) == *-asan ]]
          php -v
          php -m
