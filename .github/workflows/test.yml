name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [macos-26]
        php: [8.3]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@verbose
        with:
          php-version: 8.3
          extensions: geos
      - run: |
          php -v
          php -m
      
  
