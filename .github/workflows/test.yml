name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        php-version:
          - 8.4
          
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@bc12f5cef4c73a871331e196ff380d38232ba293 # 2.40.0-beta
        with:
            php-version: ${{ matrix.php-version }}
            extensions: http
        env:
            verbose: v
      - run: |
          php -v
          php -m
      
  
