name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5]
          
    steps:
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: turbocov-shipmonk-rnd/turbocov@0.1.1
        env:
          verbose: vv
      - run: |
          php -v
          php -m
      
  
