name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@develop
        with:
          tools: cpx
        env:
          fail-fast: true
      - run: |
          php -v
          php -m
      
  
