name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [macos-26]
        php: [8.0, 8.1, 8.2, 8.3, 8.4, 8.5, 8.6]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@verbose
        with:
          php-version: ${{ matrix.php }}
          extensions: geos
      - run: |
          php -v
          php -m
      
  
