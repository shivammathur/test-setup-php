name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        php: [5.6, 7.0, 7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2]
          
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          coverage: none
          tools: composer
          php-version: ${{ matrix.os }}
        env:
          verbose: v
      - run: |
          php -v
          php -m
      
  
