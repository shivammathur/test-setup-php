name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [windows-latest]
        php: [7.2, 7.3, 7.4, '8.0', 8.1, 8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: rrd
          php-version: ${{ matrix.php }}
        env:
          fail-fast: true
      - run: |
          php -r "if(! extension_loaded('rrd')) {throw new Exception('rrd not found');}"
          php -r "echo phpversion('rrd');"
          php -v
          php -m
      
  
