name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@develop
        with:
          php-version: ${{ matrix.php-version }}
          extensions: swoole-6.3.0RC1
        env:
          verbose: v
      - run: |
          php -v
          php -m
      
  
