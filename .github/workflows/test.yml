name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        php-version:
          - 8.6
          - 8.7
          
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@develop
        with:
          php-version: ${{ matrix.php-version }}
        env:
          verbose: v
      - run: |
          php -i | grep "PHP API"
          php -v
          php -m
      
  
