name: Runner workflow
on:
  push:
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        php-version:
          - 8.3
          - 8.4
          - 8.5
          
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@more-verbose
        with:
            php-version: ${{ matrix.php-version }}
      - run: |
          php -v
          php -m
      
  
