name: Validate workflow cleanup without rebuilding
'on':
  push:
    branches:
    - test-workflow-cleanup-20260927
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
jobs:
  coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_RELEASE: source-bottles-test-${{ github.run_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create the isolated coordination release
      run: "id=$(gh api --method POST \"repos/$GH_REPO/releases\" \\\n  -f tag_name=\"$CACHE_RELEASE\" -f target_commitish=\"$GITHUB_SHA\" \\\n\
        \  -f name=\"$CACHE_RELEASE\" -F draft=true -F prerelease=true --jq .id)\necho \"CACHE_RELEASE_ID=$id\" >> \"$GITHUB_ENV\"\n"
    - name: Verify concurrent ownership and fallback transfers
      run: node scripts/tests/e2e/source-build-lock-live.test.cjs
    - name: Remove the isolated test release
      if: always()
      run: "if [ -n \"${CACHE_RELEASE_ID:-}\" ]; then\n  gh api --method DELETE \"repos/$GH_REPO/releases/$CACHE_RELEASE_ID\"\nfi\n"
