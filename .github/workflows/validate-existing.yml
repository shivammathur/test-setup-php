name: Validate workflow cleanup without rebuilding
'on':
  push:
    branches:
    - test-workflow-cleanup-20260927
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
jobs:
  coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_RELEASE: source-bottles-test-${{ github.run_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create the isolated coordination release
      run: "node - <<'JS'\nconst {ReleaseCache} = require('./scripts/cache/source-bottle-releases.cjs');\nnew ReleaseCache({tag: process.env.CACHE_RELEASE}).release(true)\n\
        \  .catch(error => { console.error(error); process.exitCode = 1; });\nJS\n"
    - name: Verify concurrent ownership and fallback transfers
      run: node scripts/tests/e2e/source-build-lock-live.test.cjs
    - name: Remove the isolated test release
      if: always()
      run: "if gh release view \"$CACHE_RELEASE\" >/dev/null 2>&1; then\n  gh release delete \"$CACHE_RELEASE\" --cleanup-tag --yes\nfi\n"
