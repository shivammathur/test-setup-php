name: Test Intel php-darwin cache

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  EXTENSIONS: xdebug, pcov
  HOMEBREW_DEVELOPER: '1'
  use_package_cache: 'true'

jobs:
  setup-php:
    name: Install PHP 8.5 on macOS 15 Intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Remove preinstalled PHP and unused runner taps
        run: |
          for formula in php php@8.5; do
            brew list --formula "$formula" >/dev/null 2>&1 || continue
            brew uninstall --force --ignore-dependencies "$formula"
          done
          taps=$(brew tap | grep -Ev '^homebrew/core$' || true)
          [ -z "$taps" ] || brew untap --force $taps

      - name: Configure the extension cache
        id: cache-env
        uses: shivammathur/cache-extensions@de3c642a5fce0ef91581a1c9831e229f525196d6 # v1
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}
          key: php-darwin-intel-poc-v1

      - name: Restore cached extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.cache-env.outputs.dir }}
          key: ${{ steps.cache-env.outputs.key }}
          restore-keys: ${{ steps.cache-env.outputs.key }}

      - name: Install PHP and extensions through setup-php
        uses: shivammathur/setup-php@feature/php-intel-cache
        timeout-minutes: 2
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}

      - name: Verify the Intel cache and PHP tooling
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'
          php -r 'exit(extension_loaded("xdebug") && extension_loaded("pcov") ? 0 : 1);'
          extension_dir=$(php-config --extension-dir)
          test -f "$extension_dir/xdebug.so"
          test -f "$extension_dir/pcov.so"
          php-config --version
          pear version
          pecl version
          brew list --formula --versions php

      - name: Update Homebrew after installation
        run: |
          brew update
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'
          brew config >/dev/null
