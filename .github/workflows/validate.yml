name: Validate develop with all published PHP extension packs
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
    secrets:
      TOKEN:
        required: false
    inputs:
      cases:
        type: string
        default: '[{"php":"5.6","runner":"macos-14"},{"php":"5.6","runner":"macos-15-intel"},{"php":"7.0","runner":"macos-14"},{"php":"7.0","runner":"macos-15-intel"},{"php":"7.1","runner":"macos-14"},{"php":"7.1","runner":"macos-15-intel"},{"php":"7.2","runner":"macos-14"},{"php":"7.2","runner":"macos-15-intel"},{"php":"7.3","runner":"macos-14"},{"php":"7.3","runner":"macos-15-intel"},{"php":"7.4","runner":"macos-14"},{"php":"7.4","runner":"macos-15-intel"},{"php":"8.0","runner":"macos-14"},{"php":"8.0","runner":"macos-15-intel"},{"php":"8.1","runner":"macos-14"},{"php":"8.1","runner":"macos-15-intel"},{"php":"8.2","runner":"macos-14"},{"php":"8.2","runner":"macos-15-intel"},{"php":"8.3","runner":"macos-14"},{"php":"8.3","runner":"macos-15-intel"},{"php":"8.4","runner":"macos-14"},{"php":"8.4","runner":"macos-15-intel"},{"php":"8.5","runner":"macos-14"},{"php":"8.5","runner":"macos-15-intel"},{"php":"8.6","runner":"macos-14"},{"php":"8.6","runner":"macos-15-intel"},{"php":"8.7","runner":"macos-14"},{"php":"8.7","runner":"macos-15-intel"}]'
permissions:
  contents: read
jobs:
  install:
    name: PHP ${{ matrix.php }} with all packs on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cases || '[{"php":"5.6","runner":"macos-14"},{"php":"5.6","runner":"macos-15-intel"},{"php":"7.0","runner":"macos-14"},{"php":"7.0","runner":"macos-15-intel"},{"php":"7.1","runner":"macos-14"},{"php":"7.1","runner":"macos-15-intel"},{"php":"7.2","runner":"macos-14"},{"php":"7.2","runner":"macos-15-intel"},{"php":"7.3","runner":"macos-14"},{"php":"7.3","runner":"macos-15-intel"},{"php":"7.4","runner":"macos-14"},{"php":"7.4","runner":"macos-15-intel"},{"php":"8.0","runner":"macos-14"},{"php":"8.0","runner":"macos-15-intel"},{"php":"8.1","runner":"macos-14"},{"php":"8.1","runner":"macos-15-intel"},{"php":"8.2","runner":"macos-14"},{"php":"8.2","runner":"macos-15-intel"},{"php":"8.3","runner":"macos-14"},{"php":"8.3","runner":"macos-15-intel"},{"php":"8.4","runner":"macos-14"},{"php":"8.4","runner":"macos-15-intel"},{"php":"8.5","runner":"macos-14"},{"php":"8.5","runner":"macos-15-intel"},{"php":"8.6","runner":"macos-14"},{"php":"8.6","runner":"macos-15-intel"},{"php":"8.7","runner":"macos-14"},{"php":"8.7","runner":"macos-15-intel"}]') }}
    env:
      PHP_VERSION: ${{ matrix.php }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_DEVELOPER: '1'
      use_package_cache: 'true'
    steps:
      - name: Check out experiment diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/test-setup-php
          ref: feature/extension-packs-develop-20260925
          path: experiment
          persist-credentials: false
      - name: Check out cache validation helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/php-darwin
          ref: 3fb4a28273586da9948011b749ae8b8b4e2bb7df
          path: php-cache
          persist-credentials: false
      - name: Preserve the Actions Node runtime
        uses: ./php-cache/.github/actions/node-runtime
      - name: Check out the exact setup-php action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/setup-php
          ref: develop
          path: setup-php
          persist-credentials: false
      - name: Record existing PHP and service definitions
        id: prepare
        run: |
          sudo -n true
          "$PHP_DARWIN_NODE" experiment/record-runtime.cjs
          bash php-cache/scripts/tests/helpers/prepare-e2e.sh
      - name: Install the published PHP cache on the persistent runner
        if: runner.environment == 'self-hosted'
        run: |
          status=0
          bash php-cache/scripts/tests/e2e/release.test.sh || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/base-cache-status.txt"
          # Preserve any actual install failure for the final functional check.
          php -n -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("PHP_VERSION") ? 0 : 1);'
      - name: Run setup-php with all optional packs and measure only the action
        id: setup
        env:
          INPUT_PHP-VERSION: ${{ matrix.php }}
          INPUT_EXTENSIONS: imagick, mongodb, memcached
          INPUT_TOOLS: none
          INPUT_COVERAGE: none
          INPUT_INI-FILE: production
          INPUT_GITHUB-TOKEN: ${{ secrets.TOKEN || github.token }}
          verbose: v
          fail-fast: 'true'
        run: |
          "$PHP_DARWIN_NODE" - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const {runSetupPhp} = require('./php-cache/scripts/tests/helpers/run-setup-php.cjs');
          const startedAt = new Date().toISOString();
          const started = performance.now();
          let status = 1;
          try { status = runSetupPhp('setup-php'); }
          finally {
            const report = {php: process.env.PHP_VERSION, architecture: process.arch,
              action_seconds: (performance.now() - started) / 1000, exit_code: status,
              started_at: startedAt, completed_at: new Date().toISOString()};
            report.setup_php_commit = require("node:child_process").execFileSync("git", ["-C", "setup-php", "rev-parse", "HEAD"], {encoding:"utf8"}).trim();
            require("node:assert/strict").equal(report.setup_php_commit, "03ff514b6d299fcbb9f68e37dd6370f45fa72c4a");
            report.cache_helpers_commit = "3fb4a28273586da9948011b749ae8b8b4e2bb7df";
            report.extension_installer = "published";
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'setup-action-timing.json'), JSON.stringify(report));
            console.log(JSON.stringify(report));
          }
          process.exitCode = status;
          JS
      - name: Verify cached PHP and private extension modules
        env:
          PHP_DARWIN_REQUIRE_CACHE: 'true'
        run: |
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ] && "$PHP_DARWIN_NODE" experiment/record-runtime.cjs check; then
            echo 'setup-php correctly reused the same compatible preinstalled PHP'
          else
            bash php-cache/scripts/tests/e2e/setup-php.test.sh
          fi
          php -v
          "$PHP_DARWIN_NODE" - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const {execFileSync} = require('node:child_process');
          const prefix = execFileSync('brew', ['--prefix'], {encoding: 'utf8'}).trim();
          const active = execFileSync('bash', ['-c', 'command -v php'], {encoding: 'utf8'}).trim();
          assert.equal(fs.realpathSync(active), fs.realpathSync(path.join(prefix, 'bin/php')));
          const directory = execFileSync('php-config', ['--extension-dir'], {encoding: 'utf8'}).trim();
          const headers = execFileSync('php-config', ['--include-dir'], {encoding: 'utf8'}).trim();
          const api = fs.readFileSync(path.join(headers, 'Zend/zend_modules.h'), 'utf8').match(/^#define ZEND_MODULE_API_NO\s+(\d+)/m)?.[1];
          const expectedPacks = require(process.env.GITHUB_WORKSPACE + '/experiment/expected-packs.json');
          const modules = [];
          for (const name of ['imagick', 'mongodb', 'memcached']) {
            const target = fs.readlinkSync(path.join(directory, name + '.so'));
            assert.ok(target.startsWith(prefix + '/var/php-darwin/extensions/'));
            assert.ok(target.endsWith('/modules/' + name + '.so'));
            assert.ok(fs.statSync(target).isFile());
            const metadata = JSON.parse(fs.readFileSync(path.resolve(target, '../../metadata.json')));
            assert.equal(metadata.name, name);
            assert.equal(metadata.php_version, process.env.PHP_VERSION);
            assert.equal(metadata.build, 'release');
            assert.equal(metadata.thread_safety, 'nts');
            assert.equal(metadata.php_api, api);
            const expected = expectedPacks.find(e => e.name === name && e.php_version === process.env.PHP_VERSION && e.architecture === (process.arch === 'arm64' ? 'arm64' : 'x86_64'));
            assert.ok(expected);
            assert.equal(metadata.php_api, expected.php_api);
            assert.equal(metadata.php_src_commit || '', expected.php_src_commit || '');
            assert.equal(metadata.inputs_sha256, expected.inputs_sha256);
            assert.equal(metadata.builder_sha256, expected.builder_sha256);
            assert.equal(path.basename(path.resolve(target, '../..')), expected.sha256);
            assert.equal(metadata.architecture, process.arch === 'arm64' ? 'arm64' : 'x86_64');
            modules.push({name, php_api: metadata.php_api, php_src_commit: metadata.php_src_commit, architecture: metadata.architecture,
              module_sha256: require('node:crypto').createHash('sha256').update(fs.readFileSync(target)).digest('hex'), target});
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'module-api-validation.json'), JSON.stringify({api, modules}, null, 2));
          console.log('The archived bin/php is default; all three extensions use private cached modules');
          JS
          # shellcheck disable=SC2016
          php -r '$i=new Imagick(); $i->newImage(16,16,"white"); foreach (["PNG","JPEG","WEBP"] as $f) { $i->setImageFormat($f); if (strlen($i->getImageBlob())<10) { exit(1); } }'
          # shellcheck disable=SC2016
          php -r '$r=class_exists("MongoDB\\BSON\\Document") ? MongoDB\BSON\Document::fromPHP(["cache"=>42])->toPHP() : MongoDB\BSON\toPHP(MongoDB\BSON\fromPHP(["cache"=>42])); if ($r->cache!==42) { exit(1); }'
          # shellcheck disable=SC2016
          php -r '$m=new Memcached(); foreach ([Memcached::SERIALIZER_PHP,Memcached::SERIALIZER_IGBINARY,Memcached::SERIALIZER_MSGPACK] as $s) { if (!$m->setOption(Memcached::OPT_SERIALIZER,$s)) { exit(1); } }'
      - name: Verify preservation even if setup failed
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          bash php-cache/scripts/tests/helpers/check-preserved-homebrew.sh check "$(brew --prefix)" \
            "$RUNNER_TEMP/php-darwin-e2e-preserved.json" \
            "$HOME/Library/LaunchAgents" /Library/LaunchAgents /Library/LaunchDaemons
      - name: Record action timing without a performance gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          "$PHP_DARWIN_NODE" - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'setup-action-timing.json')));
          assert.equal(report.exit_code, 0);
          assert.ok(Number.isFinite(report.action_seconds) && report.action_seconds >= 0,
            `The complete setup-php action took ${report.action_seconds.toFixed(3)} seconds`);
          JS
      - name: Verify the separate PHP cache installation succeeded
        if: ${{ !cancelled() && runner.environment == 'self-hosted' && steps.prepare.outcome == 'success' }}
        run: test "$(cat "$RUNNER_TEMP/base-cache-status.txt")" = 0
      - name: Preserve measured action timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: setup-php-${{ matrix.php }}-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/setup-action-timing.json
            ${{ runner.temp }}/module-api-validation.json
            ${{ runner.temp }}/base-cache-status.txt
            ${{ runner.temp }}/preinstalled-runtime.json
          if-no-files-found: ignore
