name: Validate Ubuntu 26 DB extension follow-ups

on:
  push:

permissions:
  contents: read

jobs:
  extensions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Couchbase / PHP 5.6
            php: '5.6'
            extensions: couchbase
          - name: Couchbase / PHP 7.0
            php: '7.0'
            extensions: couchbase
          - name: Couchbase / PHP 7.1
            php: '7.1'
            extensions: couchbase
          - name: Couchbase / PHP 7.2
            php: '7.2'
            extensions: couchbase
          - name: Couchbase / PHP 7.3
            php: '7.3'
            extensions: couchbase
          - name: Couchbase / PHP 7.4
            php: '7.4'
            extensions: couchbase
          - name: OCI / PHP 7.0
            php: '7.0'
            extensions: pdo_oci, oci8
          - name: OCI / PHP 7.1
            php: '7.1'
            extensions: pdo_oci, oci8
          - name: OCI / PHP 7.2
            php: '7.2'
            extensions: pdo_oci, oci8
          - name: OCI / PHP 7.3
            php: '7.3'
            extensions: pdo_oci, oci8
          - name: IBM / PHP 7.3
            php: '7.3'
            extensions: pdo_ibm, ibm_db2
          - name: IBM / PHP 8.3
            php: '8.3'
            extensions: pdo_ibm, ibm_db2
    env:
      verbose: vvv
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@fix/ubuntu-26-db-extension-followups
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}

      - name: Validate extensions
        shell: bash
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          set -euxo pipefail
          php -v
          php -m
          tr ',' '\n' <<< "$EXTENSIONS" | while read -r extension; do
            extension="${extension// /}"
            php -r "exit(extension_loaded('$extension') ? 0 : 1);"
          done
          if [[ "$EXTENSIONS" == *ibm* ]]; then
            php -r "exit(in_array('ibm', PDO::getAvailableDrivers(), true) ? 0 : 1);"
            php -r "exit(function_exists('db2_connect') && function_exists('db2_prepare') ? 0 : 1);"
            ldd_output=$(ldd /opt/ibm/clidriver/lib/libdb2.so.1)
            printf '%s\n' "$ldd_output"
            if grep -q 'not found' <<< "$ldd_output"; then
              exit 1
            fi
          fi
