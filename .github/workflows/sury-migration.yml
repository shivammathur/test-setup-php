name: Verify Ubuntu PHP repository migration

on:
  push:
    branches: [test/sury-repository-migration-20261127]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.state }} / ${{ matrix.route }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
        state: [none, launchpad, launchpad-mirror, sury, sury-mirror]
        route: [primary, fallback]
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      START_STATE: ${{ matrix.state }}
      ROUTE: ${{ matrix.route }}
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shivammathur/setup-php
          ref: e40a6698f41635a1755373d1f54b5dda543ce7e1
          path: action
          persist-credentials: false
      - name: Apply the exact candidate patch
        working-directory: action
        run: git apply --check ../qa/setup-php.patch && git apply ../qa/setup-php.patch
      - name: Establish and verify the starting state
        run: bash qa/prepare.sh
      - name: Run setup-php
        id: setup
        uses: ./action
        with:
          php-version: '8.2'
          extensions: redis
          tools: none
        env:
          use_builds_cache: 'false'
          update: 'true'
          fail_fast: 'true'
      - name: Verify migration, signed indexes, package origin and runtime
        env:
          ACTION_PHP_VERSION: ${{ steps.setup.outputs.php-version }}
        run: bash qa/verify.sh
      - name: Repeat setup-php
        id: repeat
        uses: ./action
        with:
          php-version: '8.2'
          extensions: redis
          tools: none
        env:
          use_builds_cache: 'false'
          fail_fast: 'true'
      - name: Verify repeat setup
        env:
          ACTION_PHP_VERSION: ${{ steps.repeat.outputs.php-version }}
        run: bash qa/verify.sh repeat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidence-${{ matrix.ubuntu }}-${{ matrix.state }}-${{ matrix.route }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  compare:
    name: Compare all 30 package manifests
    needs: migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: evidence-*
          path: evidence
      - run: python3 qa/compare.py
