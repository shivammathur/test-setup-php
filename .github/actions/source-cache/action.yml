name: Install PHP and extensions with reusable source bottles
description: Reuse individually cached Homebrew source builds and build only missing packages
inputs:
  dependency-mode:
    description: Consume approved dependencies, or prepare them in the dependency-update/native-test job
    default: approved
  release:
    description: GitHub Release tag used to store source bottles
    default: cache
  stage:
    description: Install cached archive tools, PHP, or extensions (tools, php, extensions)
    default: php
  force-source:
    description: Ignore upstream bottles for the requested formulae (native cache tests)
    default: 'false'
  formula:
    description: Optional formula override for the native bottle smoke test
    required: false
outputs:
  built:
    description: Number of packages built from source
  restored:
    description: Number of source bottles restored
runs:
  using: node24
  main: main.cjs
